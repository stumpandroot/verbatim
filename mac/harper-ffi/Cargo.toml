[package]
name = "harper_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Pinned: 2.11.0 (Apache-2.0, crates.io, Sep 16 2026) is the version CI builds with the vendored zip crates and Rust 1.97.
# 2.13.0 (Oct 16 2026) exists; update on purpose and re-check harper_fix's rule names (FIX_RULES in src/lib.rs).
harper-core = "=2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# zip 8.x was yanked from crates.io (Oct 2026); harper-core 2.x still requires it.
# Vendored zip 8.6.0 and 1.1.4 (MIT) so fresh builds resolve (zip 1.x is pulled in through burn/candle).
[patch.crates-io]
zip = { path = "vendor/zip" }
zip1 = { path = "vendor/zip1", package = "zip" }
