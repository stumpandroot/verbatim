name: Verbatim
options:
  bundleIdPrefix: co.stumpandroot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0

targets:
  Verbatim:
    type: application
    platform: macOS
    sources:
      - path: Verbatim
        excludes: ["Info.plist", "Verbatim.entitlements"]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Verbatim/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Stump & Root Co."
        NSMicrophoneUsageDescription: "Verbatim records voice memos with your microphone and transcribes them on this Mac. Nothing is uploaded."
        NSHighResolutionCapable: true
    entitlements:
      path: Verbatim/Verbatim.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.allow-jit: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim
        PRODUCT_NAME: Verbatim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        DEAD_CODE_STRIPPING: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
