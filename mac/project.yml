name: Verbatim
options:
  bundleIdPrefix: co.stumpandroot
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.17.7
  # Automatic updates for the Mac app (direct download). Mac target only; see mac/Updates/README.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  Verbatim:
    type: application
    # Shared schemes, so both apps always appear in Xcode's scheme menu after `xcodegen generate`.
    scheme: {}
    platform: macOS
    sources:
      - path: Verbatim
        excludes: ["Info.plist", "Verbatim.entitlements", "Verbatim-iCloud.entitlements", "Helper.entitlements", "Bridging.h"]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle
    info:
      path: Verbatim/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Stump & Root Co."
        NSMicrophoneUsageDescription: "Verbatim records voice memos and dictation with your microphone and transcribes them on this Mac. Recordings stay on this Mac, or in your own iCloud if you turn on sync."
        NSAudioCaptureUsageDescription: "Verbatim records the audio of the app you choose and transcribes it on this Mac. No video is kept."
        NSHighResolutionCapable: true
        # Sparkle (mac/Updates/README.md). The feed lives on the `updates` branch; CI rewrites it.
        SUFeedURL: https://raw.githubusercontent.com/stumpandroot/verbatim/updates/appcast.xml
        # PLACEHOLDER: paste the EdDSA public key printed by Sparkle's `generate_keys` here.
        # While this is empty, the app never starts the updater (no checks, no error dialogs).
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Never send Sparkle's anonymous system profile; a check sends only the IP address and app version.
        SUEnableSystemProfiling: false
    entitlements:
      path: Verbatim/Verbatim.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim
        PRODUCT_NAME: Verbatim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        DEAD_CODE_STRIPPING: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        # Running from Xcode (Debug) adds iCloud so the Mac syncs with the iPhone. CI and build.sh builds
        # (Release) keep the plain entitlements, so unsigned and Developer ID builds still launch.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Verbatim/Verbatim-iCloud.entitlements
    postBuildScripts:
      - name: Bundle the link helper
        basedOnDependencyAnalysis: false
        script: |
          if [ -x "$SRCROOT/Helpers/yt-dlp" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            cp "$SRCROOT/Helpers/yt-dlp" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/yt-dlp"
          fi

  VerbatimPhone:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: VerbatimPhone
        excludes: ["Info.plist", "VerbatimPhone.entitlements"]
      - Verbatim/Model
      - Verbatim/Transcription
      - Verbatim/Document/DocumentText.swift
      - Verbatim/Document/Harper.swift
      - Verbatim/Document/Polish.swift
      - Verbatim/Sources/MediaImport.swift
      - Verbatim/App/Changed.swift
      - Verbatim/App/Log.swift
      - Verbatim/App/Links.swift
      - Verbatim/Audio/Player.swift
      - Verbatim/Audio/Recorder.swift
      - Verbatim/Audio/LiveMeter.swift
      - Verbatim/Export/Exporter.swift
      - Verbatim/Export/ZipWriter.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Brand.swift
      - Verbatim/Views/KindViews.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: VerbatimPhone/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers: [co.stumpandroot.verbatim.ios.transcribe]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Verbatim records voice memos with your microphone and transcribes them on this iPhone."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: VerbatimPhone/VerbatimPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.co.stumpandroot.verbatim]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.co.stumpandroot.verbatim]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios-sim"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios
        PRODUCT_NAME: Verbatim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true
