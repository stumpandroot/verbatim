name: Verbatim
options:
  bundleIdPrefix: co.stumpandroot
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.17.7
  # Automatic updates for the Mac app (direct download). Mac target only; see mac/Updates/README.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # Fetches YouTube audio on the iPhone (VerbatimPhone only; the Mac uses yt-dlp). MIT. Pinned exactly because
  # it tracks YouTube's private API; update it on purpose. See YOUTUBE_ON_DEVICE below.
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.9

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  Verbatim:
    type: application
    # Shared schemes, so both apps always appear in Xcode's scheme menu after `xcodegen generate`.
    scheme: {}
    platform: macOS
    sources:
      - path: Verbatim
        excludes: ["Info.plist", "Verbatim.entitlements", "Verbatim-iCloud.entitlements", "Helper.entitlements", "Bridging.h"]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle
    info:
      path: Verbatim/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Stump & Root Co."
        NSMicrophoneUsageDescription: "Verbatim records voice memos and dictation with your microphone and transcribes them on this Mac. Recordings stay on this Mac, or in your own iCloud if you turn on sync."
        NSAudioCaptureUsageDescription: "Verbatim records the audio of the app you choose and transcribes it on this Mac. No video is kept."
        # Live words (Audio/LiveTranscriber.swift): on-device only; asked for on systems before macOS 26.
        NSSpeechRecognitionUsageDescription: "Verbatim shows your words as you speak, on this Mac."
        # The You page's "Where you dictate" (App/SiteCapture.swift): the front tab's host only, asked once per browser.
        NSAppleEventsUsageDescription: "Verbatim reads the website you're dictating into, by domain only, to show where you dictate."
        NSHighResolutionCapable: true
        # Sparkle (mac/Updates/README.md). The feed lives on the `updates` branch; CI rewrites it.
        SUFeedURL: https://raw.githubusercontent.com/stumpandroot/verbatim/updates/appcast.xml
        # PLACEHOLDER: paste the EdDSA public key printed by Sparkle's `generate_keys` here.
        # While this is empty, the app never starts the updater (no checks, no error dialogs).
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Never send Sparkle's anonymous system profile; a check sends only the IP address and app version.
        SUEnableSystemProfiling: false
    entitlements:
      path: Verbatim/Verbatim.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
        # Watched folders keep access through security-scoped bookmarks. The Mac app isn't sandboxed, so these
        # are inert today; they keep the bookmarks working if the sandbox is ever turned on.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Hardened runtime: asking a browser for its front tab's address (App/SiteCapture.swift).
        com.apple.security.automation.apple-events: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim
        PRODUCT_NAME: Verbatim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        DEAD_CODE_STRIPPING: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        # Running from Xcode (Debug) adds iCloud so the Mac syncs with the iPhone. CI and build.sh builds
        # (Release) keep the plain entitlements, so unsigned and Developer ID builds still launch.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Verbatim/Verbatim-iCloud.entitlements
    postBuildScripts:
      - name: Bundle the link helper
        basedOnDependencyAnalysis: false
        script: |
          if [ -x "$SRCROOT/Helpers/yt-dlp" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            cp "$SRCROOT/Helpers/yt-dlp" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/yt-dlp"
          fi

  VerbatimPhone:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: VerbatimPhone
        excludes: ["Info.plist", "VerbatimPhone.entitlements"]
      - Verbatim/Model
      - Verbatim/Transcription
      - Verbatim/Document/DocumentText.swift
      - Verbatim/Document/Harper.swift
      - Verbatim/Document/Polish.swift
      - Verbatim/Sources/MediaImport.swift
      - Verbatim/Sources/LinkImport.swift
      - Verbatim/App/Changed.swift
      - Verbatim/App/Log.swift
      - Verbatim/App/Links.swift
      - Verbatim/Audio/Player.swift
      - Verbatim/Audio/Recorder.swift
      - Verbatim/Audio/LiveMeter.swift
      - Verbatim/Audio/LiveTranscriber.swift
      - Verbatim/Audio/LiveCaptions.swift
      - Verbatim/Export/Exporter.swift
      - Verbatim/Export/ExportCore.swift
      - Verbatim/Export/ExportOptionsForm.swift
      - Verbatim/Export/ZipWriter.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Brand.swift
      - Verbatim/Views/LinkAddedCard.swift
      - Verbatim/Views/KindViews.swift
      - Verbatim/Views/SummaryBlock.swift
      - Verbatim/Views/VoiceEnrollment.swift
      - Verbatim/Flow/CleanupPrepass.swift
      - Verbatim/Flow/DictationFormatter.swift
      # Dictation cleanup with Apple's on-device model (iOS 26), its meaning guard, and the cleanup level and
      # snippet types (FlowSettings; on the iPhone only `cleanup` is read, under the Mac's key, per device).
      - Verbatim/Flow/Cleanup.swift
      - Verbatim/Flow/MeaningCheck.swift
      - Verbatim/Flow/FlowSettings.swift
      # Shared with the keyboard extension: the App Group channel and the voice bars.
      - VerbatimKeyboard/KeyboardBridge.swift
      - VerbatimKeyboard/VoiceBars.swift
      # Shared with the widget extension: the keyboard session's Live Activity and its End session intent.
      - VerbatimWidgets/SessionActivity.swift
      # Shared with the share and broadcast extensions: the App Group inbox they fill and the app imports.
      - VerbatimShare/VerbatimInbox.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: YouTubeKit
        product: YouTubeKit
      # The Verbatim keyboard, embedded in the app's PlugIns folder.
      - target: VerbatimKeyboard
      # The keyboard session's Live Activity (Dynamic Island and Lock Screen), also in PlugIns.
      - target: VerbatimWidgets
      # Verbatim in the share sheet (videos, audio, links), also in PlugIns.
      - target: VerbatimShare
      # Transcribe what's playing: the ReplayKit broadcast extension that keeps app audio only, also in PlugIns.
      - target: VerbatimBroadcast
    info:
      path: VerbatimPhone/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers: [co.stumpandroot.verbatim.ios.transcribe]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Verbatim records voice memos with your microphone and transcribes them on this iPhone."
        # Live words (Audio/LiveTranscriber.swift), on device only; for the keyboard session's live words later.
        NSSpeechRecognitionUsageDescription: "Verbatim shows your words as you speak, on this iPhone."
        ITSAppUsesNonExemptEncryption: false
        # The keyboard session's Live Activity (KeyboardSession.swift, VerbatimWidgets).
        NSSupportsLiveActivities: true
        # verbatim://session?start=1… opens the app from the Verbatim keyboard to start a session.
        CFBundleURLTypes:
          - CFBundleURLName: co.stumpandroot.verbatim.ios
            CFBundleURLSchemes: [verbatim]
    entitlements:
      path: VerbatimPhone/VerbatimPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.co.stumpandroot.verbatim]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.co.stumpandroot.verbatim]
        # Shared with the keyboard (KeyboardBridge.appGroup). Xcode's automatic signing registers the group.
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios-sim"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios
        # YOUTUBE_ON_DEVICE: the iPhone fetches YouTube audio itself (PhoneLinkFetcher, YouTubeKit). App Store
        # guideline 5.2.3 bars apps that download media from third-party services such as YouTube without
        # the service's permission, so App Review may reject a build with it. For an App Store build, remove
        # YOUTUBE_ON_DEVICE here (and the YouTubeKit dependency above to drop the code entirely): YouTube links
        # then go to the Mac, like any other site the iPhone can't fetch.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) YOUTUBE_ON_DEVICE"
        PRODUCT_NAME: Verbatim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The Verbatim keyboard: voice-first, no letter keys. It hands recording and transcription to the app through
  # the App Group (VerbatimKeyboard/KeyboardBridge.swift). Kept small for the keyboard memory limit: no speech
  # engines, no Harper, only the shared palette and brand drawing.
  VerbatimKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimKeyboard
        excludes: ["Info.plist", "VerbatimKeyboard.entitlements"]
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Brand.swift
    info:
      path: VerbatimKeyboard/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Needed for the App Group (the words come back through it) and for opening the app.
            RequestsOpenAccess: true
    entitlements:
      path: VerbatimKeyboard/VerbatimKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.keyboard
        PRODUCT_NAME: VerbatimKeyboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The keyboard session's Live Activity: the Dynamic Island and Lock Screen while Verbatim keeps the microphone
  # ready for the keyboard. Draws only; the app starts, updates, and ends it. The End session button runs an
  # AppIntent in the app's process, so this extension needs no App Group.
  VerbatimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimWidgets
        excludes: ["Info.plist"]
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Brand.swift
    info:
      path: VerbatimWidgets/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.widgets
        PRODUCT_NAME: VerbatimWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # Verbatim in the share sheet. A shared video or audio file is copied into the App Group inbox
  # (VerbatimShare/VerbatimInbox.swift) and transcribed the next time the app opens; a web link goes to the app's link
  # flow. A TikTok link gets an explanation instead: nothing here downloads TikTok media (guideline 5.2.3). Only the
  # palette is shared, to stay small.
  VerbatimShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimShare
        excludes: ["Info.plist", "VerbatimShare.entitlements"]
      - Verbatim/Views/Tokens.swift
    info:
      path: VerbatimShare/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Up to five videos or audio files, or a web link (not other files shared by location).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
              OR (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              AND NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"))
              ).@count BETWEEN {1, 5}).@count >= 1
    entitlements:
      path: VerbatimShare/VerbatimShare.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.share
        PRODUCT_NAME: VerbatimShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # Transcribe what's playing: a ReplayKit broadcast upload extension. It keeps only the sound other apps play
  # (.audioApp), never the screen or the microphone, streams it to an AAC file in the App Group, and the app
  # transcribes it when the broadcast stops (VerbatimBroadcast/SampleHandler.swift).
  VerbatimBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimBroadcast
        excludes: ["Info.plist", "VerbatimBroadcast.entitlements"]
      - VerbatimShare/VerbatimInbox.swift
    info:
      path: VerbatimBroadcast/Info.plist
      properties:
        CFBundleName: Verbatim
        CFBundleDisplayName: Verbatim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: VerbatimBroadcast/VerbatimBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.broadcast
        PRODUCT_NAME: VerbatimBroadcast
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true
