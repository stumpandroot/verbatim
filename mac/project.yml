name: Verbatim
options:
  bundleIdPrefix: co.stumpandroot
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    # The Apple Watch app and its complications (DESIGN.md §20): watchOS 11 for the double-tap gesture on Mark and the
    # Smart Stack. An iPhone on iOS 17 still runs Verbose; only the watch needs watchOS 11.
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
  # Pinned exactly (the version CI resolved, 503b4bd): the speech models and their APIs change between releases.
  # Every package's version is also fixed by mac/Package.resolved; update both on purpose.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
  # Automatic updates for the Mac app (direct download). Mac target only; see mac/Updates/README.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # Fetches YouTube audio on the iPhone (VerbatimPhone only; the Mac uses yt-dlp). MIT. Pinned exactly because
  # it tracks YouTube's private API; update it on purpose. See YOUTUBE_ON_DEVICE below.
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.9

# AppStore: a Release build with VERBATIM_APP_STORE=YES, for App Store and TestFlight archives (mac/APP_STORE.md).
configs:
  Debug: debug
  Release: release
  AppStore: release

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
  AppStore: Local.xcconfig

# The App Store switch (mac/APP_STORE.md): one setting, VERBATIM_APP_STORE. NO (Debug, Release, CI, Tim's own
# builds) keeps every feature. YES (the AppStore configuration, or `VERBATIM_APP_STORE=YES` on the xcodebuild
# command line) defines APP_STORE in every iPhone target, which compiles out the undocumented iOS interfaces
# and YOUTUBE_ON_DEVICE. The iPhone targets pick their conditions with $(VERBATIM_*_CONDITIONS_$(VERBATIM_APP_STORE)).
settings:
  base:
    # Versions (VERSIONING.md): one marketing version for every target, the apps and their extensions alike. It stays
    # numeric for App Store Connect; the channel ("beta" until launch, empty for the App Store release) is its own
    # setting, VerboseChannel in the apps' Info.plist, and the apps show "Version 1.0 beta (217)".
    MARKETING_VERSION: "1.0"
    VERBOSE_CHANNEL: beta
    VERBATIM_APP_STORE: "NO"
    VERBATIM_PHONE_CONDITIONS_NO: YOUTUBE_ON_DEVICE
    VERBATIM_PHONE_CONDITIONS_YES: APP_STORE
    VERBATIM_EXTENSION_CONDITIONS_NO: ""
    VERBATIM_EXTENSION_CONDITIONS_YES: APP_STORE
  configs:
    AppStore:
      VERBATIM_APP_STORE: "YES"

schemes:
  # Product › Archive with this scheme makes an App Store build (the AppStore configuration).
  VerbatimPhone App Store:
    build:
      targets:
        VerbatimPhone: all
    run:
      config: AppStore
    test:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore

targets:
  Verbatim:
    type: application
    # Shared schemes, so both apps always appear in Xcode's scheme menu after `xcodegen generate`.
    scheme: {}
    platform: macOS
    sources:
      - path: Verbatim
        excludes: ["Info.plist", "Verbatim.entitlements", "Verbatim-iCloud.entitlements", "Helper.entitlements", "Bridging.h"]
      # What's new (Model/ReleaseNotes.swift): the release notes, shared with the iPhone app. CI stamps the "next"
      # entry with the run number in its checkout before building (ReleaseNotes/README.md).
      - ReleaseNotes/ReleaseNotes.json
      # The desktop widgets' snapshot and links (App/WidgetFeed.swift writes it; VerbatimMacWidgets reads it).
      - VerbatimWidgets/WidgetSnapshot.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle
      # The desktop widgets, embedded in the app's PlugIns folder.
      - target: VerbatimMacWidgets
      # The audio-only LGPL FFmpeg (mac/ffmpeg/build.sh builds Vendor/ffmpeg), linked dynamically and embedded as
      # separate frameworks so anyone can replace them (Resources/FFmpeg/FFmpeg-NOTICE.txt).
      - framework: Vendor/ffmpeg/libavutil.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libswresample.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libavcodec.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libavformat.xcframework
        embed: true
    info:
      path: Verbatim/Info.plist
      properties:
        # Public name: Verbose ("Verbatim" is the internal codename; DESIGN.md §4). CFBundleName drives the menu bar
        # ("About Verbose", "Hide Verbose", "Quit Verbose"). The bundle file stays Verbatim.app (build.sh, CI, the DMG,
        # and Sparkle's in-place update all use that path), so the Dock, Finder, Launchpad, and Spotlight get "Verbose"
        # from Verbatim/Resources/en.lproj/InfoPlist.strings: Finder shows a localized display name only when the
        # unlocalized CFBundleDisplayName matches the bundle's file name, so this one stays "Verbatim" on purpose.
        CFBundleName: Verbose
        CFBundleDisplayName: Verbatim
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VerboseChannel: $(VERBOSE_CHANNEL)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Stump & Root Co."
        NSMicrophoneUsageDescription: "Verbose records voice memos and dictation with your microphone and transcribes them on this Mac. Recordings stay on this Mac, or in your own iCloud if you turn on sync."
        # Core Audio process taps (Audio/ProcessTapCapture.swift, the meeting capture test behind the meetings.poc flag):
        # macOS shows this the first time a tap's aggregate device starts. Without the key the tap delivers silence.
        NSAudioCaptureUsageDescription: "Verbose records the other people in your meetings from the app's audio, on this Mac."
        # Live words (Audio/LiveTranscriber.swift): on-device only; asked for on systems before macOS 26. Also
        # languages outside Parakeet v3's 25 (Transcription/LanguageCheck.swift, AppleSpeech), on device only.
        NSSpeechRecognitionUsageDescription: "Verbose shows your words as you speak, and transcribes languages its own models don't cover, on this Mac."
        # The You page's "Where you dictate" (App/SiteCapture.swift): the front tab's host only, asked once per browser.
        NSAppleEventsUsageDescription: "Verbose reads the website you're dictating into, by domain only, to show where you dictate."
        # Dictionary › Suggest names from Contacts (Model/ContactNames.swift): names only, read when you ask.
        NSContactsUsageDescription: "Verbose suggests names from your contacts for your Dictionary, so it spells them correctly. Names stay on this device."
        NSHighResolutionCapable: true
        # verbatim:// links from the desktop widgets (WidgetLink in VerbatimWidgets/WidgetSnapshot.swift): a transcript,
        # Record, Dictate, and the Thought pad. App/SystemHooks.swift handles them.
        CFBundleURLTypes:
          - CFBundleURLName: co.stumpandroot.verbatim
            CFBundleURLSchemes: [verbatim]
        # The App Group container shared with the desktop widgets (WidgetSnapshotStore). Team-prefixed, the form macOS
        # accepts from a Developer ID app without a provisioning profile; unsigned builds have no prefix. The widget
        # extension carries the same key.
        VerbatimAppGroup: $(TeamIdentifierPrefix)co.stumpandroot.verbatim
        # Sparkle (mac/Updates/README.md). The feed lives in the public stumpandroot/verbose-updates repo (main
        # branch), which holds only the feed and the DMGs; CI rewrites it.
        SUFeedURL: https://raw.githubusercontent.com/stumpandroot/verbose-updates/main/appcast.xml
        # PLACEHOLDER: paste the EdDSA public key printed by Sparkle's `generate_keys` here.
        # While this is empty, the app never starts the updater (no checks, no error dialogs).
        SUPublicEDKey: "W533v9Px+e+XqEDtg8wcczByjszt33amZZAELO3HWV8="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Never send Sparkle's anonymous system profile; a check sends only the IP address and app version.
        SUEnableSystemProfiling: false
        # Finder › Quick Actions (or Services) › Transcribe with Verbatim, for audio and video files. Handled by
        # App/SystemHooks.swift (ServiceProvider.transcribeFiles); Verbatim opens if it isn't running.
        NSServices:
          - NSMenuItem:
              default: Transcribe with Verbose
            NSMessage: transcribeFiles
            NSPortName: Verbatim
            NSRequiredContext: {}
            NSSendFileTypes: [public.audio, public.movie]
        # Containers the bundled FFmpeg reads (Sources/FFmpegAudio.swift), declared so the open panel and drag and drop
        # know them as video or audio. Imported, not exported: a system or app declaration wins.
        UTImportedTypeDeclarations: &importedMediaTypes
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
          - UTTypeIdentifier: org.matroska.mka
            UTTypeDescription: Matroska audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [mka]
              public.mime-type: [audio/x-matroska]
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
              public.mime-type: [video/webm]
          - UTTypeIdentifier: com.microsoft.windows-media-wmv
            UTTypeDescription: Windows Media video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [wmv]
              public.mime-type: [video/x-ms-wmv]
          - UTTypeIdentifier: com.microsoft.windows-media-wma
            UTTypeDescription: Windows Media audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [wma]
              public.mime-type: [audio/x-ms-wma]
          - UTTypeIdentifier: com.microsoft.advanced-systems-format
            UTTypeDescription: Advanced Systems Format
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [asf]
              public.mime-type: [video/x-ms-asf]
          - UTTypeIdentifier: com.adobe.flash.video
            UTTypeDescription: Flash video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [flv]
              public.mime-type: [video/x-flv]
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [ogg, oga]
              public.mime-type: [audio/ogg]
          - UTTypeIdentifier: org.xiph.ogg-video
            UTTypeDescription: Ogg video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [ogv]
              public.mime-type: [video/ogg]
          - UTTypeIdentifier: org.xiph.opus
            UTTypeDescription: Opus audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [opus]
              public.mime-type: [audio/opus]
    entitlements:
      path: Verbatim/Verbatim.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.allow-jit: false
        # No disable-library-validation and no allow-unsigned-executable-memory here: everything the app loads
        # (Sparkle, the FFmpeg frameworks, the Swift packages) is signed with the app's own team, and Harper is
        # linked in statically. Only the yt-dlp helper needs the two exceptions (Helper.entitlements, build.sh).
        # Replacing an FFmpeg framework (LGPL) means signing the app again, as any change to a signed bundle does.
        # Watched folders keep access through security-scoped bookmarks. The Mac app isn't sandboxed, so these
        # are inert today; they keep the bookmarks working if the sandbox is ever turned on.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Hardened runtime: asking a browser for its front tab's address (App/SiteCapture.swift).
        com.apple.security.automation.apple-events: true
        # Hardened runtime: reading contact names for Dictionary suggestions (Model/ContactNames.swift).
        com.apple.security.personal-information.addressbook: true
        # The App Group container shared with the desktop widgets (VerbatimMacWidgets): the snapshot they draw.
        # build.sh fills in the team prefix when it signs; Verbatim-iCloud.entitlements (Debug) has the same group.
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)co.stumpandroot.verbatim]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper $(SRCROOT)/Vendor/ffmpeg/include"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim
        PRODUCT_NAME: Verbatim
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        DEAD_CODE_STRIPPING: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        # Running from Xcode (Debug) adds iCloud so the Mac syncs with the iPhone. CI and build.sh builds
        # (Release) keep the plain entitlements, so unsigned and Developer ID builds still launch.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Verbatim/Verbatim-iCloud.entitlements
    postBuildScripts:
      - name: Bundle the link helper
        basedOnDependencyAnalysis: false
        script: |
          if [ -x "$SRCROOT/Helpers/yt-dlp" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            cp "$SRCROOT/Helpers/yt-dlp" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/yt-dlp"
          fi

  # The Mac's desktop widgets: Record and Dictate, Recent recordings, This week, and Quick capture
  # (VerbatimWidgets/HomeWidgets.swift, shared with iPhone). Draws only, from the snapshot the app writes to the App
  # Group container (App/WidgetFeed.swift); every click opens a verbatim:// link in the app. WidgetKit loads only a
  # sandboxed extension, so this one has the App Sandbox (the app itself isn't sandboxed) and reads nothing outside
  # the group. Signed like the app, with the hardened runtime and a timestamp (build.sh).
  VerbatimMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: VerbatimMacWidgets
        excludes: ["Info.plist", "VerbatimMacWidgets.entitlements"]
      - VerbatimWidgets/WidgetSnapshot.swift
      - VerbatimWidgets/HomeWidgets.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      - Verbatim/Views/Brand.swift
    info:
      path: VerbatimMacWidgets/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Stump & Root Co."
        # The same group as the app's (see the Verbatim target).
        VerbatimAppGroup: $(TeamIdentifierPrefix)co.stumpandroot.verbatim
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VerbatimMacWidgets/VerbatimMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)co.stumpandroot.verbatim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.widgets
        PRODUCT_NAME: VerbatimMacWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VERBATIM_WIDGETS"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        APPLICATION_EXTENSION_API_ONLY: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  VerbatimPhone:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: VerbatimPhone
        excludes: ["Info.plist", "VerbatimPhone.entitlements"]
      - Verbatim/Model
      # What's new (Model/ReleaseNotes.swift): the release notes, shared with the Mac app (ReleaseNotes/README.md).
      - ReleaseNotes/ReleaseNotes.json
      # The built-in modern vocabulary (Model/BuiltInVocabulary.swift) and the everyday fixes (Flow/EverydayFixes.swift),
      # shared with the Mac.
      - Verbatim/Resources/ModernVocabulary.json
      - Verbatim/Resources/EverydayFixes.json
      - Verbatim/Transcription
      - Verbatim/Document/DocumentText.swift
      - Verbatim/Document/CleanupGuard.swift
      - Verbatim/Document/Harper.swift
      - Verbatim/Document/Polish.swift
      - Verbatim/Sources/MediaImport.swift
      # How long an MP4's samples really are (MediaImport checks fragmented files such as YouTube's M4A with it).
      - Verbatim/Sources/MP4Timing.swift
      # The bundled FFmpeg's C layer and Swift side, its notice and license, and the import self-test. Its test
      # files (Resources/TestFixtures) stay out of the iPhone app, so they never ship to the App Store; the
      # iPhone self-test skips the import checks without them (the Mac's self-test runs them).
      - Verbatim/Sources/VBFFmpeg.c
      - Verbatim/Sources/VBFFmpeg.h
      - Verbatim/Sources/FFmpegAudio.swift
      - Verbatim/Sources/MediaImportSelfTest.swift
      - Verbatim/Resources/FFmpeg
      - Verbatim/Views/Acknowledgements.swift
      - Verbatim/Sources/LinkImport.swift
      # Cloud share links (Dropbox, Google Drive, OneDrive, SharePoint, iCloud Drive): the rules, their self-tests,
      # and the probe that confirms a direct download. Shared with the Mac.
      - Verbatim/Sources/CloudShareLink.swift
      - Verbatim/Sources/CloudShareLinkChecks.swift
      - Verbatim/Sources/CloudShareFetch.swift
      - Verbatim/App/Changed.swift
      - Verbatim/App/Log.swift
      - Verbatim/App/Links.swift
      - Verbatim/Audio/Player.swift
      # Reduce background noise while listening (Apple's voice isolation), shared with the Mac.
      - Verbatim/Audio/ListeningCleanup.swift
      - Verbatim/Audio/Recorder.swift
      - Verbatim/Audio/LiveMeter.swift
      - Verbatim/Audio/LiveTranscriber.swift
      - Verbatim/Audio/LiveCaptions.swift
      - Verbatim/Export/Exporter.swift
      - Verbatim/Export/ExportCore.swift
      - Verbatim/Export/ExportOptionsForm.swift
      - Verbatim/Export/ZipWriter.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      # Switching looks: the card, the rebuild behind it, and its timing (shared with the Mac).
      - Verbatim/Views/LookSwitch.swift
      - Verbatim/Views/Brand.swift
      - Verbatim/Views/ThumbCache.swift
      - Verbatim/Views/HomeKit.swift
      - Verbatim/Views/LinkAddedCard.swift
      - Verbatim/Views/KindViews.swift
      # Thoughts' drawings: the icon with its moving wave, the empty day, and Ways in (shared with the Mac).
      - Verbatim/Views/ThoughtViews.swift
      - Verbatim/Views/SpeakerSuggestionRows.swift
      - Verbatim/Views/SponsorViews.swift
      # The reading view's "unclear 2:10" chips, low-confidence words, and the Reduce background noise item.
      - Verbatim/Views/NoisyAudioViews.swift
      - Verbatim/Views/NoisyAudioChecks.swift
      - Verbatim/Views/LibraryFilterBar.swift
      - Verbatim/Views/SummaryBlock.swift
      # Templates' icons and a result's sections, shared with the Mac (Model/Templates.swift).
      - Verbatim/Views/TemplateViews.swift
      - Verbatim/Views/VoiceEnrollment.swift
      - Verbatim/Flow/CleanupPrepass.swift
      # Spoken corrections ("scratch that", "at 2, actually 3"), shared with the keyboard, and their self-tests.
      - Verbatim/Flow/SpokenCorrections.swift
      - Verbatim/Flow/SpokenCorrectionsChecks.swift
      - Verbatim/Flow/DictationFormatter.swift
      # Dictation cleanup with Apple's on-device model (iOS 26), its meaning guard, and the cleanup level and
      # snippet types (FlowSettings; on the iPhone only `cleanup` is read, under the Mac's key, per device).
      - Verbatim/Flow/Cleanup.swift
      - Verbatim/Flow/MeaningCheck.swift
      - Verbatim/Flow/FlowSettings.swift
      # Harper's grammar pass on dictation (in the app process, where keyboard cleanup runs; never in the
      # keyboard extension), and the opt-in cloud cleanup with your own key.
      - Verbatim/Flow/GrammarPass.swift
      - Verbatim/Flow/EverydayFixes.swift
      - Verbatim/Flow/CloudCleanup.swift
      # Shared with the keyboard extension: the App Group channel, the voice bars, and the format chip's rules
      # and the App Store switch (KeyboardFormat.swift).
      - VerbatimKeyboard/KeyboardBridge.swift
      - VerbatimKeyboard/BridgeTrust.swift
      - VerbatimKeyboard/VoiceBars.swift
      - VerbatimKeyboard/KeyboardFormat.swift
      # Settings › Keyboard › Dictate button: the stored size, position, and style the keyboard draws.
      - VerbatimKeyboard/DictateButton.swift
      # The look the keyboard reads (Settings › Appearance › Look), for the self-test.
      - VerbatimKeyboard/KeyboardLook.swift
      # Shared with the widget extension: the Start dictation session intent (Control Center, Action button).
      - VerbatimWidgets/StartSessionIntent.swift
      # Shared with the widget extension: the keyboard session's Live Activity and its End session intent.
      - VerbatimWidgets/SessionActivity.swift
      # Shared with the widget extension: the recording's Live Activity and its Pause, Resume, and Stop intents.
      - VerbatimWidgets/RecordingActivity.swift
      # Shared with the widget extension: the recording ribbon's rules (Live Activity words, routing, timeouts) and
      # its intents (Dictate, Done, Cancel, the Action button, and the Control Center session switch).
      - VerbatimWidgets/RibbonRules.swift
      - VerbatimWidgets/DictateIntents.swift
      # Shared with the widget extension: Record from a widget or control (records in place when iOS allows), and the
      # Home Screen widgets' snapshot and links, which App/WidgetFeed.swift writes to the App Group.
      - VerbatimWidgets/RecordVoiceNoteIntent.swift
      # Shared with the widget extension: New thought (widgets, the control, Siri, Shortcuts) and Thoughts' rules.
      - VerbatimWidgets/NewThoughtIntent.swift
      - VerbatimWidgets/ThoughtRules.swift
      - VerbatimWidgets/WidgetSnapshot.swift
      - Verbatim/App/WidgetFeed.swift
      # Shared with the share and broadcast extensions: the App Group inbox they fill and the app imports.
      - VerbatimShare/VerbatimInbox.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: YouTubeKit
        product: YouTubeKit
      # The audio-only LGPL FFmpeg, as on the Mac. The app decodes; the share extension only copies files to the inbox.
      - framework: Vendor/ffmpeg/libavutil.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libswresample.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libavcodec.xcframework
        embed: true
      - framework: Vendor/ffmpeg/libavformat.xcframework
        embed: true
      # The Verbatim keyboard, embedded in the app's PlugIns folder.
      - target: VerbatimKeyboard
      # The keyboard session's Live Activity (Dynamic Island and Lock Screen), also in PlugIns.
      - target: VerbatimWidgets
      # Verbatim in the share sheet (videos, audio, links), also in PlugIns.
      - target: VerbatimShare
      # Transcribe what's playing: the ReplayKit broadcast extension that keeps app audio only, also in PlugIns.
      - target: VerbatimBroadcast
      # The Apple Watch app (VerbatimWatch, DESIGN.md §20), in the app's Watch folder. One switch leaves it out:
      # VERBOSE_WATCH=NO bash tools/generate-project.sh drops the marked lines, so the iPhone app builds and ships
      # without it (CI's TestFlight job retries that way if the watch app fails to sign). Keep only this dependency
      # between the markers; tools/test-watch.sh checks.
      # >>> Apple Watch
      - target: VerbatimWatch
      # <<< Apple Watch
    info:
      path: VerbatimPhone/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VerboseChannel: $(VERBOSE_CHANNEL)
        UILaunchScreen: {}
        # fetch: Ask's scheduled recipes run in a background app refresh (AskBackgroundRefresh, PhoneBackgroundWork.swift).
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [co.stumpandroot.verbatim.ios.transcribe, co.stumpandroot.verbatim.ios.recipes]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Verbose records voice memos and dictation with your microphone, and keeps it ready for the Verbose keyboard while a session is on. Audio is transcribed on this iPhone and goes to your own iCloud only when you turn on iCloud sync."
        # Live words (Audio/LiveTranscriber.swift), on device only; for the keyboard session's live words later.
        # Also languages outside Parakeet v3's 25 (Transcription/LanguageCheck.swift, AppleSpeech), on device only.
        NSSpeechRecognitionUsageDescription: "Verbose shows your words as you speak, and transcribes languages its own models don't cover, on this iPhone."
        # Dictionary › Suggest names from Contacts (Model/ContactNames.swift): names only, read when you ask.
        NSContactsUsageDescription: "Verbose suggests names from your contacts for your Dictionary, so it spells them correctly. Names stay on this device."
        ITSAppUsesNonExemptEncryption: false
        # The keyboard session's Live Activity (KeyboardSession.swift, VerbatimWidgets).
        NSSupportsLiveActivities: true
        # verbatim://session?start=1… opens the app from the Verbatim keyboard to start a session.
        CFBundleURLTypes:
          - CFBundleURLName: co.stumpandroot.verbatim.ios
            CFBundleURLSchemes: [verbatim]
        # MKV, WebM, and the other containers the bundled FFmpeg reads, so the file picker offers them.
        UTImportedTypeDeclarations: *importedMediaTypes
    entitlements:
      path: VerbatimPhone/VerbatimPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.co.stumpandroot.verbatim]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.co.stumpandroot.verbatim]
        # Shared with the keyboard (KeyboardBridge.appGroup). Xcode's automatic signing registers the group.
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Verbatim/Bridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/harper $(SRCROOT)/Vendor/ffmpeg/include"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/harper/ios-sim"
        OTHER_LDFLAGS: "$(inherited) -lharper_ffi"
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios
        # YOUTUBE_ON_DEVICE: the iPhone fetches YouTube audio itself (PhoneLinkFetcher, YouTubeKit). App Store
        # guideline 5.2.3 bars apps that download media from third-party services such as YouTube without
        # the service's permission, so App Review may reject a build with it. App Store builds
        # (VERBATIM_APP_STORE=YES) define APP_STORE instead: YouTube links then go to the Mac, like any other
        # site the iPhone can't fetch. YouTubeKit stays linked but nothing calls it; remove the dependency above
        # to drop it from the binary too.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(VERBATIM_PHONE_CONDITIONS_$(VERBATIM_APP_STORE))"
        PRODUCT_NAME: Verbatim
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The Verbatim keyboard: dictation plus a basic typing layout (QWERTY, 123, #+=). Typing works without Allow Full
  # Access (App Store guideline 4.4.1). Dictation hands recording and transcription to the app through the App
  # Group (VerbatimKeyboard/KeyboardBridge.swift), so it needs Full Access. Kept small for the keyboard memory
  # limit: no speech engines, no Harper, only the shared palette and brand drawing.
  VerbatimKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimKeyboard
        excludes: ["Info.plist", "VerbatimKeyboard.entitlements"]
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      - Verbatim/Views/Brand.swift
      # Pure string rules: strikes out spoken corrections in the live words, and the notice after inserting.
      - Verbatim/Flow/SpokenCorrections.swift
    info:
      path: VerbatimKeyboard/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Asks for Allow Full Access, which dictation needs for the App Group (the words come back through it)
            # and for opening the app. Typing works without it.
            RequestsOpenAccess: true
    entitlements:
      path: VerbatimKeyboard/VerbatimKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.keyboard
        PRODUCT_NAME: VerbatimKeyboard
        # APP_STORE in App Store builds: no host bundle ID, no opening Verbatim from the keyboard.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(VERBATIM_EXTENSION_CONDITIONS_$(VERBATIM_APP_STORE))"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The keyboard session's Live Activity (the recording ribbon): the Dynamic Island and Lock Screen while Verbatim
  # keeps the microphone ready. Draws only; the app starts, updates, and ends it. Its buttons run App Intents in the
  # app's process. The Control Center session switch reads whether a session is on from the App Group
  # (KeyboardBridge.sessionLive), so this extension is in the group too. Also the Home Screen, Lock Screen, and
  # StandBy widgets (HomeWidgets.swift), which read the app's snapshot and look from the App Group.
  VerbatimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimWidgets
        excludes: ["Info.plist", "VerbatimWidgets.entitlements"]
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      - Verbatim/Views/Brand.swift
      - VerbatimKeyboard/KeyboardBridge.swift
      - VerbatimKeyboard/BridgeTrust.swift
    info:
      path: VerbatimWidgets/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VerbatimWidgets/VerbatimWidgets.entitlements
      properties:
        # Shared with the app and the keyboard (KeyboardBridge.appGroup): the session switch's state.
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.widgets
        PRODUCT_NAME: VerbatimWidgets
        # RecordingActivity.swift leaves its app-only cleanup out of the extension.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VERBATIM_WIDGETS $(VERBATIM_EXTENSION_CONDITIONS_$(VERBATIM_APP_STORE))"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # Verbatim in the share sheet. A shared video or audio file is copied into the App Group inbox
  # (VerbatimShare/VerbatimInbox.swift) and transcribed the next time the app opens; a web link goes to the app's link
  # flow. A TikTok link gets an explanation instead: nothing here downloads TikTok media (guideline 5.2.3). Only the
  # palette is shared, to stay small.
  VerbatimShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimShare
        excludes: ["Info.plist", "VerbatimShare.entitlements"]
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
    info:
      path: VerbatimShare/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Up to five videos or audio files, or a web link (not other files shared by location).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.matroska.mkv"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.webmproject.webm"
              OR (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              AND NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"))
              ).@count BETWEEN {1, 5}).@count >= 1
        UTImportedTypeDeclarations: *importedMediaTypes
    entitlements:
      path: VerbatimShare/VerbatimShare.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.share
        PRODUCT_NAME: VerbatimShare
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # Transcribe what's playing: a ReplayKit broadcast upload extension. It keeps only the sound other apps play
  # (.audioApp), never the screen or the microphone, streams it to an AAC file in the App Group, and the app
  # transcribes it when the broadcast stops (VerbatimBroadcast/SampleHandler.swift).
  VerbatimBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: VerbatimBroadcast
        excludes: ["Info.plist", "VerbatimBroadcast.entitlements"]
      - VerbatimShare/VerbatimInbox.swift
    info:
      path: VerbatimBroadcast/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: VerbatimBroadcast/VerbatimBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.broadcast
        PRODUCT_NAME: VerbatimBroadcast
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The Apple Watch app (DESIGN.md §20; mockup "Library features", section 4): Record and New thought, a recording
  # screen with Mark and Stop, and Sent to iPhone. It records AAC into its own outbox and sends each file to the iPhone
  # with Watch Connectivity, which queues it until the iPhone is in reach; the iPhone imports, transcribes, and syncs
  # it (VerbatimPhone/PhoneWatch.swift). Always dark. Embedded in the iPhone app's Watch folder (the switch on
  # VerbatimPhone's dependencies). Kept small: the wire format, the palette, and the glyphs, nothing else shared.
  VerbatimWatch:
    type: application
    platform: watchOS
    sources:
      - path: VerbatimWatch
        excludes: ["Info.plist", "VerbatimWatch.entitlements"]
      - Verbatim/Model/WatchTransfer.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      - Verbatim/Views/Brand.swift
    dependencies:
      # The complications and the Smart Stack card, in the watch app's PlugIns folder.
      - target: VerbatimWatchWidgets
    info:
      path: VerbatimWatch/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.stumpandroot.verbatim.ios
        # The iPhone transcribes, so the watch app comes with the iPhone app.
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: "Verbose records voice notes and thoughts on your Apple Watch and sends them to your iPhone, which transcribes them."
        # Recording goes on with the screen off or your wrist down while its audio session is active.
        UIBackgroundModes: [audio]
        # verbatim://watch/record and …/thought from the complications and the Smart Stack (WatchRules).
        CFBundleURLTypes:
          - CFBundleURLName: co.stumpandroot.verbatim.ios.watchkitapp
            CFBundleURLSchemes: [verbatim]
    entitlements:
      path: VerbatimWatch/VerbatimWatch.entitlements
      properties:
        # Shared with the complications only (on the watch): the iPhone's thought count and the unsent thoughts.
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.watchkitapp
        PRODUCT_NAME: VerbatimWatch
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true

  # The watch's complications and Smart Stack card (WidgetKit): Record (circular), today's thoughts (rectangular), and
  # the last capture with a relevance score for the Smart Stack. They draw only, from what the watch app keeps in the
  # App Group, and open the watch app to its recorder; they can't record on their own.
  VerbatimWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: VerbatimWatchWidgets
        excludes: ["Info.plist", "VerbatimWatchWidgets.entitlements"]
      - Verbatim/Model/WatchTransfer.swift
      - Verbatim/Views/Tokens.swift
      - Verbatim/Views/Look.swift
      - Verbatim/Views/Brand.swift
    info:
      path: VerbatimWatchWidgets/Info.plist
      properties:
        CFBundleName: Verbose
        CFBundleDisplayName: Verbose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VerbatimWatchWidgets/VerbatimWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.co.stumpandroot.verbatim.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.stumpandroot.verbatim.ios.watchkitapp.widgets
        PRODUCT_NAME: VerbatimWatchWidgets
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: true
