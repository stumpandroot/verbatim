name: Quick check (compile only)

# Runs on every push to a branch other than main: compiles the Mac and iPhone apps side by side, with no signing,
# notarization, screenshots, or bench, so a mistake shows up in minutes. The full build (build-swift.yml) still runs
# on main and on demand.
#
# To save macOS minutes (about $0.062 a minute in a private repo), a branch compiles only the apps its changes reach
# since it left integrate: the Mac app for its targets' sources, the iPhone app for the iPhone targets' sources (the
# app, its extensions, and the Mac folders they list in mac/project.yml), and both for the project, package pins,
# vendored builds, and CI (.github/workflows/scripts/ci-targets.py decides). integrate always compiles both. The brand
# check and the Linux logic tests run on every push. Docs-only pushes (*.md) don't run at all, except mac/DESIGN.md,
# which the brand check reads, and the vendored crates under mac/harper-ffi.

on:
  push:
    branches-ignore: [main, ci-screens, updates]
    # Later patterns win: every .md under mac/ is left out, then mac/DESIGN.md and mac/harper-ffi are put back.
    paths:
      - "mac/**"
      - "!mac/**/*.md"
      - "mac/DESIGN.md"
      - "mac/harper-ffi/**"
      - ".github/workflows/check-swift.yml"
      - ".github/workflows/scripts/**"

# Read-only token; no secrets are used here. Actions are pinned to full commit SHAs (the tag is in the comment).
permissions:
  contents: read

concurrency:
  group: check-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand:
    name: Brand check (mac/DESIGN.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check icons, colors, glass, and marks against mac/DESIGN.md
        run: bash mac/tools/brand-check.sh

  # Which compiles this push needs (Linux, about 15 seconds). Commits and trees only, no file contents, and only
  # mac/project.yml and the script checked out; the token isn't kept, so it works the same in a private repo.
  changes:
    name: Pick the compiles
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            mac/project.yml
            .github/workflows/scripts/
          sparse-checkout-cone-mode: false
      - name: Compare with where the branch left integrate
        id: pick
        run: |
          set -u
          if [ "$GITHUB_REF" = refs/heads/integrate ]; then
            OUT="$(printf 'mac=true\nphone=true')"; echo "integrate compiles both apps."
          else
            BASE="$(git merge-base HEAD origin/integrate 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || true)"
            if [ -n "$BASE" ]; then
              OUT="$(python3 .github/workflows/scripts/ci-targets.py "$BASE" HEAD)" || OUT="$(printf 'mac=true\nphone=true')"
            else
              OUT="$(printf 'mac=true\nphone=true')"; echo "::warning::No merge base with integrate or main; compiling both apps."
            fi
          fi
          T=()
          grep -qx 'mac=true' <<< "$OUT" && T+=('"Mac"')
          grep -qx 'phone=true' <<< "$OUT" && T+=('"iPhone"')
          J="[$(IFS=,; echo "${T[*]}")]"
          echo "Compiles: $J"
          echo "targets=$J" >> "$GITHUB_OUTPUT"

  # Skipped (not failed) when the push reaches neither app. The App Store pass is part of the iPhone leg.
  compile:
    name: Compile (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version

      # The grammar library depends only on mac/harper-ffi and its build scripts, so a library built from the same
      # files (by this job, or by build-swift.yml on main, whose caches every branch can read) is reused as is; Rust
      # is installed and Harper built only when there's none. Keep the paths and key in step with build-swift.yml.
      - name: Cache the grammar library
        id: harper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            mac/Vendor/harper/libharper_ffi.a
            mac/Vendor/harper/ios
            mac/Vendor/harper/ios-sim
          key: harper-${{ matrix.target == 'Mac' && 'mac' || 'ios' }}-${{ hashFiles('mac/harper-ffi/Cargo.lock', 'mac/harper-ffi/Cargo.toml', 'mac/harper-ffi/rust-toolchain.toml', 'mac/harper-ffi/src/**', 'mac/harper-ffi/vendor/**', 'mac/Vendor/harper/build.sh', 'mac/Vendor/harper/build-ios.sh') }}

      # Same toolchain as mac/harper-ffi/rust-toolchain.toml; change both together.
      - name: Install Rust (Harper grammar engine)
        if: steps.harper.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target == 'Mac' && 'aarch64-apple-darwin, x86_64-apple-darwin' || 'aarch64-apple-ios-sim, x86_64-apple-ios' }}
      # The same keys as build-swift.yml's Mac and iPhone jobs, which run the same Harper build scripts.
      - name: Cache cargo
        if: steps.harper.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: ${{ matrix.target == 'Mac' && 'cargo' || 'cargo-ios' }}-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.lock', 'mac/harper-ffi/Cargo.toml', 'mac/harper-ffi/rust-toolchain.toml') }}
      # build-swift.yml's Mac job saves this key on main, so a branch's first push finds the packages too.
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac/build/spm
          # Exact inputs only: no prefix fallback, so a cache made for other package versions is never restored.
          key: spm-${{ hashFiles('mac/project.yml', 'mac/Package.resolved') }}

      # The audio-only LGPL FFmpeg (mac/ffmpeg/build.sh): built once, then restored from the cache until the script
      # (version, checksum, or options) changes. The first build takes about 10 minutes.
      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}
      - name: Build FFmpeg (audio only, LGPL)
        run: |
          bash ffmpeg/build.sh
          echo "FFmpeg per slice (added to the app):"
          for s in macos-arm64_x86_64 ios-arm64 ios-arm64_x86_64-simulator; do
            echo "  $s: $(du -sch Vendor/ffmpeg/*.xcframework/$s/*.framework 2>/dev/null | tail -1 | cut -f1)"
          done

      - name: Generate the project
        run: |
          brew install xcodegen
          [ -f Local.xcconfig ] || : > Local.xcconfig
          xcodegen generate --quiet
          bash tools/package-resolved.sh install
      - name: Build the grammar library
        if: steps.harper.outputs.cache-hit != 'true'
        run: if [ "${{ matrix.target }}" = "Mac" ]; then bash Vendor/harper/build.sh; else bash Vendor/harper/build-ios.sh; fi

      - name: Compile
        run: |
          set -o pipefail
          if [ "${{ matrix.target }}" = "Mac" ]; then
            ARGS=(-scheme Verbatim -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          else
            ARGS=(-scheme VerbatimPhone -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          fi
          if ! xcodebuild -project Verbatim.xcodeproj "${ARGS[@]}" -configuration Debug -derivedDataPath build/dd \
              -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 20 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 30 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          echo "${{ matrix.target }} compiles."
          APP="$(ls -d build/dd/Build/Products/Debug*/Verbatim.app | head -1)"
          FW="$APP/Contents/Frameworks"; [ -d "$FW" ] || FW="$APP/Frameworks"
          ls -d "$FW"/libav*.framework "$FW"/libswresample.framework || { echo "::error::FFmpeg's frameworks aren't embedded in $APP"; exit 1; }
          echo "FFmpeg frameworks in the ${{ matrix.target }} app: $(du -sch "$FW"/libav*.framework "$FW"/libswresample.framework | tail -1 | cut -f1)"

      # Every Swift package version comes from mac/Package.resolved; a build that resolved anything else fails.
      - name: Swift package versions match Package.resolved
        run: bash tools/package-resolved.sh check

      # The App Store switch (mac/APP_STORE.md): the iPhone app again with VERBATIM_APP_STORE=YES, in the same
      # derived data, so only Verbatim's own targets recompile. Then proves the flag took effect: APP_STORE was
      # passed, YOUTUBE_ON_DEVICE wasn't, and no undocumented selector or class name is left in the app.
      - name: Compile the App Store build
        if: matrix.target == 'iPhone'
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/appstore.log"
          if ! xcodebuild -project Verbatim.xcodeproj -scheme VerbatimPhone -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath build/dd \
              -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO VERBATIM_APP_STORE=YES build > "$LOG" 2>&1; then
            grep -E "error:" "$LOG" | sort -u | head -n 20 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 30 "$LOG"
            exit 1
          fi
          echo "Swift compiles in the App Store pass: $(grep -c '^SwiftCompile\|^SwiftDriver\|^CompileSwift' "$LOG" || true); lines naming APP_STORE: $(grep -c 'APP_STORE' "$LOG" || true)"
          # The conditions each target resolves with the flag on (cheap, and doesn't depend on the log's format).
          for t in VerbatimPhone VerbatimKeyboard VerbatimWidgets; do
            c=$(xcodebuild -project Verbatim.xcodeproj -target "$t" -sdk iphonesimulator -configuration Debug \
                  VERBATIM_APP_STORE=YES -showBuildSettings 2>/dev/null | grep -E "^ *SWIFT_ACTIVE_COMPILATION_CONDITIONS =" || true)
            echo "$t: $c"
            echo "$c" | grep -qw APP_STORE || { echo "::error::$t doesn't define APP_STORE in the App Store build"; exit 1; }
            if echo "$c" | grep -qw YOUTUBE_ON_DEVICE; then echo "::error::$t still defines YOUTUBE_ON_DEVICE"; exit 1; fi
          done
          APP=build/dd/Build/Products/Debug-iphonesimulator/Verbatim.app
          for s in _hostBundleID _hostApplicationBundleIdentifier _systemNavigationAction LSApplicationWorkspace openApplicationWithBundleID; do
            if grep -r -a -l -- "$s" "$APP" | grep -v '\.swiftmodule\|\.swiftdoc\|\.abi\.json' | grep .; then
              echo "::error::The App Store build still contains $s"; exit 1
            fi
          done
          if grep -r -a -l -- "openURL:options:completionHandler:" "$APP/PlugIns/VerbatimKeyboard.appex" | grep .; then
            echo "::error::The App Store keyboard still opens URLs by selector"; exit 1
          fi
          echo "The App Store build compiles, with no undocumented interfaces."

  # The pure-logic tests (mac/tools/test-*.sh): no Xcode, so they run on Linux with Swift 6.1.2 from swift.org.
  logic:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The tarball's SHA-256, taken from a copy whose swift.org PGP signature (.sig, "Swift 6.x Release Signing
      # Key", EF80A866B47A981F) checked out. The cache key includes it, so a new pin never reuses an old toolchain.
      - name: Cache Swift 6.1.2
        id: swiftcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swift-6.1.2-RELEASE-ubuntu24.04
          key: swift-6.1.2-RELEASE-ubuntu24.04-d749d5fe2d6709ee
      - name: Install Swift 6.1.2
        env:
          SWIFT_SHA256: d749d5fe2d6709ee988e96b16f02bca7b53304d09925e31063fd5ec56019de9f
          CACHE_HIT: ${{ steps.swiftcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != "true" ]; then
            curl -fsSL --retry 5 -o "$RUNNER_TEMP/swift.tar.gz" \
              "https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz"
            echo "${SWIFT_SHA256}  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c - || { echo "::error::Swift tarball checksum mismatch"; exit 1; }
            tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/swift.tar.gz"
          fi
          echo "$RUNNER_TEMP/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - name: Run every mac/tools/test-*.sh
        run: |
          swiftc --version
          failed=()
          for t in mac/tools/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then echo "$t passed"; else failed+=("$t"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            for t in "${failed[@]}"; do echo "::error::$t failed"; done
            exit 1
          fi
          echo "All logic tests passed."
