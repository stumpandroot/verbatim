name: Build Mac app

# Builds, signs, notarizes, and publishes Verbatim.dmg for Apple Silicon and Intel Macs.
#
# Runs on every push of a version tag (v1.0.0) and on demand from the Actions tab.
# A tag push also creates a GitHub Release with both DMGs attached.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE           Developer ID Application certificate as base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  Password set when exporting the .p12
#   APPLE_ID                    Apple ID email of the developer account
#   APPLE_TEAM_ID               10-character Team ID
#   APPLE_APP_PASSWORD          App-specific password from appleid.apple.com
# Without them the build still runs and produces an unsigned DMG for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    defaults:
      run:
        working-directory: link-transcriber
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store notarization credentials
        if: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials verbatim-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, package, notarize
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          DMG_SUFFIX: -${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}" bash macapp/build_mac.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Verbatim-${{ matrix.arch }}
          path: link-transcriber/dist/Verbatim-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dmgs/*.dmg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
