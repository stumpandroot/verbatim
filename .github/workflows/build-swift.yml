name: Build Mac app (SwiftUI)

# Builds, signs, notarizes, and publishes the native Verbatim.app as a universal DMG.
# Runs on pushes to main that touch mac/, on version tags such as mac-v2.0.0, and on demand. The Mac and iPhone parts
# run on separate runners at the same time; the speech bench runs only when speech or dictation code changed (or with
# [bench] in the commit message). Branch pushes get the quick compile check instead (check-swift.yml).
# Secrets: MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD, and
# MACOS_PROVISION_PROFILE (a Developer ID provisioning profile with iCloud, base64). Without them the build
# is unsigned and keeps everything on the Mac.
# TestFlight (iPhone): ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8 (an App Store Connect API key with the Admin role,
# so Xcode can manage distribution signing). With them, every build of main uploads the iPhone app to TestFlight.
# Automatic updates (Sparkle, mac/Updates/README.md): SPARKLE_PRIVATE_KEY (EdDSA key from `generate_keys -x`). With it
# and a Developer ID-signed, notarized DMG, builds of main become beta-<run> prereleases and mac-v* tags become
# stable releases, and the `updates` branch's appcast.xml points at them.

on:
  push:
    branches: [main]
    tags: ["mac-v*"]
    paths: ["mac/**", ".github/workflows/build-swift.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build still running, so an old build can't overwrite a newer DMG on ci-screens.
concurrency:
  group: build-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    defaults:
      run:
        working-directory: mac
    # The DMG's Sparkle signature, for the release job's appcast update on mac-v* tags (not secret).
    outputs:
      sparkle_signature: ${{ steps.sparkle.outputs.signature }}
      sparkle_length: ${{ steps.sparkle.outputs.length }}
      sparkle_short_version: ${{ steps.sparkle.outputs.short_version }}
      sparkle_bundle_version: ${{ steps.sparkle.outputs.bundle_version }}
    env:
      # Only whether the key exists; the key itself is passed to the one step that signs.
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Decide whether the speech bench runs
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          RUN=false
          case "$GITHUB_REF" in refs/tags/*) RUN=true ;; esac
          git log -1 --format=%B | grep -qi '\[bench\]' && RUN=true
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            git fetch -q --depth 50 origin main || true
            BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)"
            [ "$BASE" = "$(git rev-parse HEAD)" ] && BASE="$(git rev-parse HEAD~1)"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD || true)"
          echo "$CHANGED" | sed 's/^/changed: /'
          # Speech recognition, dictation, cleanup, audio, the bench itself, package versions, or this workflow.
          if echo "$CHANGED" | grep -Eq '^mac/Verbatim/(Transcription|Audio)/|^mac/Verbatim/Flow/(Cleanup|CleanupPrepass|MeaningCheck|Paster|FlowSettings)\.swift|^mac/Verbatim/App/(Dictation|Bench)\.swift|^mac/Bench/|^mac/project\.yml|^\.github/workflows/build-swift\.yml'; then RUN=true; fi
          echo "bench=$RUN" >> "$GITHUB_OUTPUT"
          echo "Speech bench: $RUN"

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version; sw_vers

      - name: Install Rust (Harper grammar engine)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.toml') }}
      - name: Install XcodeGen
        run: brew install xcodegen

      # The audio-only LGPL FFmpeg (mac/ffmpeg/build.sh). build.sh builds it when the cache doesn't have this version.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          if [ -n "$MACOS_PROVISION_PROFILE" ]; then
            echo "$MACOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/verbatim.provisionprofile"
            echo "PROVISION_PROFILE=$RUNNER_TEMP/verbatim.provisionprofile" >> "$GITHUB_ENV"
          fi

      - name: Store notarization credentials
        if: ${{ env.APPLE_APP_PASSWORD != '' }}
        run: |
          xcrun notarytool store-credentials verbatim-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, package, notarize
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/mac-v') && github.ref_name || '0.0.0' }}
          BUILD: ${{ github.run_number }}
          DMG_SUFFIX: -universal
        run: |
          set -o pipefail
          if ! VERSION="${VERSION#mac-v}" bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 6 "$RUNNER_TEMP/build.log" | cut -c1-400 | while IFS= read -r line; do echo "::error::${line}"; done
            cat "$RUNNER_TEMP/build.log" build/xcodebuild.log 2>/dev/null | grep -E "error(\[E[0-9]+\])?:" | grep -v "Compiling\|Downloaded\|thiserror" | sort -u | head -n 4 | cut -c1-400 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Screenshot the app and publish to the ci-screens branch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x; set +e
          pkill -9 -x Verbatim || true; sleep 1
          OUT="$RUNNER_TEMP/shots"; rm -rf "$OUT"; mkdir -p "$OUT" dist/screens
          cp "dist/Verbatim-universal.dmg" "$OUT/Verbatim-universal-${GITHUB_RUN_NUMBER}.dmg"
          # A stable name for the same DMG, so .../raw/ci-screens/Verbatim-latest.dmg survives the force-push below.
          # Identical bytes share one git blob, so this adds no size. The iPhone and bench steps clone and add to this
          # commit, so they keep it.
          cp "dist/Verbatim-universal.dmg" "$OUT/Verbatim-latest.dmg"
          open --env VERBATIM_UITEST=1 build/Build/Products/Release/Verbatim.app > "$OUT/open-${GITHUB_RUN_NUMBER}.txt" 2>&1; echo "open exit=$?" >> "$OUT/open-${GITHUB_RUN_NUMBER}.txt"
          sleep 20
          perl -e 'alarm 15; exec @ARGV' screencapture -x "$OUT/transcript-${GITHUB_RUN_NUMBER}.png" || true
          # Screenshot tour: the app writes the current screen's name to show.txt; capture each one.
          SHOW="$HOME/Library/Logs/Verbatim/show.txt"; TOUR="$OUT/screens-${GITHUB_RUN_NUMBER}"; mkdir -p "$TOUR"; last=""
          for i in $(seq 1 300); do
            cur="$(cat "$SHOW" 2>/dev/null || true)"
            if [ -n "$cur" ] && [ "$cur" != "$last" ]; then
              last="$cur"; [ "$cur" = "done" ] && break
              sleep 1.0; perl -e 'alarm 10; exec @ARGV' screencapture -x "$TOUR/$cur.png" || true
            fi
            sleep 0.5
          done
          (cd "$OUT" && zip -qr "screens-${GITHUB_RUN_NUMBER}.zip" "screens-${GITHUB_RUN_NUMBER}" && rm -rf "screens-${GITHUB_RUN_NUMBER}") || true
          PID="$(pgrep -x Verbatim | head -1 || true)"
          # Main-thread spin shows as sustained CPU on an idle app. Sample three times, 2 s apart.
          { echo "pid=$PID"; for i in 1 2 3; do ps -o %cpu=,rss= -p "$PID" || echo "gone"; sleep 2; done; } > "$OUT/cpu-${GITHUB_RUN_NUMBER}.txt" 2>&1 || true
          perl -e 'alarm 25; exec @ARGV' sample "$PID" 3 -file "$OUT/sample-${GITHUB_RUN_NUMBER}.txt" || echo "sample timed out" > "$OUT/sample-${GITHUB_RUN_NUMBER}.txt"
          perl -e 'alarm 15; exec @ARGV' screencapture -x "$OUT/home-${GITHUB_RUN_NUMBER}.png" || true
          cp "$HOME/Library/Logs/Verbatim/native.log" "$OUT/native-${GITHUB_RUN_NUMBER}.log" || true
          pkill -9 -x Verbatim || true
          sleep 3
          # A crash on launch leaves a report here; keep it so the failure is readable without artifact storage.
          ls -t "$HOME/Library/Logs/DiagnosticReports"/Verbatim* 2>/dev/null | head -1 | while read -r f; do cp "$f" "$OUT/crash-${GITHUB_RUN_NUMBER}.ips"; done
          log show --last 3m --predicate 'process == "Verbatim"' --style compact > "$OUT/oslog-${GITHUB_RUN_NUMBER}.txt" 2>&1 || true
          cp "$OUT"/*.png dist/screens/ || true
          # The ci-screens branch is reachable where artifact storage is not.
          cd "$OUT" && git init -q && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co"
          git add . && git commit -q -m "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screens

      - name: UI self-test gate (macOS 26)
        run: |
          LOG="$HOME/Library/Logs/Verbatim/native.log"
          tail -n 60 "$LOG" || echo "no native.log"
          ls -t "$HOME/Library/Logs/DiagnosticReports"/Verbatim* 2>/dev/null | head -1 | xargs -I{} sh -c 'echo "::error::crash report {}"; head -c 6000 "{}"'
          grep "UITEST" "$LOG" || { echo "::error::no UITEST lines in the log"; exit 1; }
          grep -q "UITEST DONE" "$LOG" || { echo "::error::self-test did not finish"; exit 1; }
          if grep -q "UITEST FAIL" "$LOG"; then grep "UITEST FAIL" "$LOG" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi

      - name: Upload screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: mac/dist/screens/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Verbatim-universal
          path: mac/dist/Verbatim-universal.dmg
          if-no-files-found: error

      # Automatic updates (mac/Updates/README.md). Builds of main (push or workflow_dispatch) and mac-v* tags only,
      # and only with the Sparkle key and a Developer ID certificate. Never blocks the build.
      - name: "Updates: sign the DMG for Sparkle"
        id: sparkle
        if: env.HAS_SPARKLE_KEY == 'true' && env.MACOS_CERTIFICATE != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v'))
        continue-on-error: true
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          DMG=dist/Verbatim-universal.dmg
          if ! codesign -dvv "$DMG" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            echo "::warning::The DMG isn't signed with a Developer ID certificate; no update is published."; exit 0
          fi
          if ! xcrun stapler validate "$DMG" > /dev/null 2>&1; then
            echo "::warning::The DMG isn't notarized; no update is published."; exit 0
          fi
          T="$RUNNER_TEMP/sparkle-tools"; rm -rf "$T"; mkdir -p "$T"
          curl -fsSL -o "$T/Sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $T/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$T/Sparkle.tar.xz" -C "$T"
          # The key goes in on stdin (--ed-key-file -); it is never echoed or written to disk.
          OUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$T/bin/sign_update" --ed-key-file - "$DMG")"
          SIG="$(printf '%s' "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(printf '%s' "$OUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')"
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then echo "::error::sign_update returned no signature"; exit 1; fi
          echo "Sparkle signature for build ${GITHUB_RUN_NUMBER}: length=$LEN"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LEN" >> "$GITHUB_OUTPUT"
          PLIST=build/Build/Products/Release/Verbatim.app/Contents/Info.plist
          echo "short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" >> "$GITHUB_OUTPUT"

      - name: "Updates: publish this build of main as a beta"
        if: steps.sparkle.outputs.signature != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIG: ${{ steps.sparkle.outputs.signature }}
          LEN: ${{ steps.sparkle.outputs.length }}
          SHORT: ${{ steps.sparkle.outputs.short_version }}
          BUNDLE: ${{ steps.sparkle.outputs.bundle_version }}
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}"; TAG="beta-${N}"; R="$GITHUB_REPOSITORY"
          SUBJECT="$(git log -1 --format=%s)"
          if gh release view "$TAG" -R "$R" > /dev/null 2>&1; then
            # A re-run keeps the run number: replace the asset rather than failing.
            gh release upload "$TAG" dist/Verbatim-universal.dmg -R "$R" --clobber
          else
            gh release create "$TAG" dist/Verbatim-universal.dmg -R "$R" --prerelease --target "$GITHUB_SHA" \
              --title "Beta build ${N}" \
              --notes "Automatic beta build ${N} of main (${GITHUB_SHA::7}): ${SUBJECT}. For testing; tagged releases are the stable channel."
          fi
          URL="https://github.com/${R}/releases/download/${TAG}/Verbatim-universal.dmg"
          bash Updates/publish-appcast.sh --channel beta --version "$BUNDLE" --short-version "$SHORT" \
            --url "$URL" --length "$LEN" --signature "$SIG" \
            --title "Verbose beta ${N}" --notes "Beta build ${N}: ${SUBJECT}" \
            --notes-link "https://github.com/${R}/releases/tag/${TAG}"
          # Keep the newest 5 beta prereleases; delete older ones and their tags.
          gh release list -R "$R" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^beta-[0-9]+$"))) | .tagName' \
            | sort -t- -k2,2 -n -r | tail -n +6 | while IFS= read -r OLD; do
              echo "Deleting old beta $OLD"
              gh release delete "$OLD" -R "$R" --yes --cleanup-tag || echo "::warning::couldn't delete $OLD"
            done

      # Accuracy and latency bench (mac/Bench/README.md). Every step here is continue-on-error: a bench problem
      # never blocks a build. It runs last, after the DMG is published, and adds bench-<run>.json and bench-<run>.md to
      # the ci-screens commit for this build.
      - name: "Bench: find the FluidAudio version (model cache key)"
        if: steps.changes.outputs.bench == 'true'
        id: fluidver
        continue-on-error: true
        run: |
          V="$(python3 - <<'PY'
          import glob, json
          v = ""
          for p in glob.glob("Verbatim.xcodeproj/**/Package.resolved", recursive=True):
              try:
                  d = json.load(open(p))
              except Exception:
                  continue
              for pin in d.get("pins") or d.get("object", {}).get("pins", []):
                  if (pin.get("identity") or pin.get("package") or "").lower() == "fluidaudio":
                      st = pin.get("state") or {}
                      v = st.get("version") or st.get("revision", "")[:12]
          if not v:
              try:
                  d = json.load(open("build/spm/workspace-state.json"))
                  for dep in d["object"]["dependencies"]:
                      if dep["packageRef"]["identity"] == "fluidaudio":
                          st = dep["state"].get("checkoutState", {})
                          v = st.get("version") or st.get("revision", "")[:12]
              except Exception:
                  pass
          print(v or "unknown")
          PY
          )"
          echo "FluidAudio $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: "Bench: restore speech models"
        if: steps.changes.outputs.bench == 'true'
        id: benchcache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Application Support/Verbatim/models
            ~/Library/Application Support/FluidAudio/Models
          key: bench-models-${{ runner.os }}-fluidaudio-${{ steps.fluidver.outputs.version }}
          restore-keys: |
            bench-models-${{ runner.os }}-fluidaudio-${{ steps.fluidver.outputs.version }}-

      - name: "Bench: run the synthetic clips through dictation's pipeline"
        if: steps.changes.outputs.bench == 'true'
        id: bench
        continue-on-error: true
        timeout-minutes: 30
        env:
          FLUIDAUDIO_VERSION: ${{ steps.fluidver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"
          B="$RUNNER_TEMP/bench"; rm -rf "$B"; mkdir -p "$B/out" "$B/clips"
          LOGDIR="$HOME/Library/Logs/Verbatim"; REPORTS="$HOME/Library/Logs/DiagnosticReports"
          touch "$B/started"
          # Clips come from the runner's built-in voices, so no private audio is involved.
          say -v '?' > "$B/out/bench-voices-${N}.txt" 2>&1
          bash Bench/make-clips.sh "$B/clips" > "$B/out/bench-clips-${N}.log" 2>&1
          echo "clips: $(ls "$B/clips"/*.wav 2>/dev/null | wc -l | tr -d ' ')"
          pkill -9 -x Verbatim || true
          rm -f "$LOGDIR/native.log"
          # VERBATIM_UITEST=1 gives a clean offline profile (no iCloud, no welcome screens); -bench turns the UI tour off.
          # Models download from Hugging Face on the first run. The app stops itself at 20 minutes with a partial report.
          open -W -n --env VERBATIM_UITEST=1 build/Build/Products/Release/Verbatim.app --args \
            -bench "$B/clips" -benchOut "$B/out/bench-${N}.json" -benchModels "v3,ultra,v2" -benchMinutes 20 \
            -benchLabel "build ${N} (${GITHUB_SHA::7})" > "$B/open.txt" 2>&1 &
          OPENPID=$!
          for i in $(seq 1 1380); do kill -0 "$OPENPID" 2>/dev/null || break; sleep 1; done
          pkill -9 -x Verbatim || true
          wait "$OPENPID" 2>/dev/null
          # Compare vocabulary-boost profiles on the two fastest models (a few minutes each).
          for PROF in norescue legacy; do
            open -W -n --env VERBATIM_UITEST=1 build/Build/Products/Release/Verbatim.app --args \
              -bench "$B/clips" -benchOut "$B/out/bench-${N}-${PROF}.json" -benchModels "v3,v2" -benchMinutes 8 -benchCleanup none \
              -fluidBoostProfile "$PROF" -benchLabel "build ${N} boost=${PROF}" >> "$B/open.txt" 2>&1 &
            P2=$!
            for i in $(seq 1 540); do kill -0 "$P2" 2>/dev/null || break; sleep 1; done
            pkill -9 -x Verbatim || true
            wait "$P2" 2>/dev/null
          done
          # Keep the bench's log and any crash out of the UI self-test's way.
          mv "$LOGDIR/native.log" "$B/out/bench-native-${N}.log" 2>/dev/null || true
          find "$REPORTS" -name 'Verbatim*' -newer "$B/started" 2>/dev/null | head -1 | while read -r f; do mv "$f" "$B/out/bench-crash-${N}.ips"; done
          if [ ! -s "$B/out/bench-${N}.md" ]; then
            { echo "# Verbatim bench: build ${N}"; echo; echo "The bench produced no report. Last log lines:"; echo; echo '```'
              grep BENCH "$B/out/bench-native-${N}.log" 2>/dev/null | tail -n 20; cat "$B/open.txt" 2>/dev/null; echo '```'; } > "$B/out/bench-${N}.md"
          fi
          cat "$B/out/bench-${N}.md" >> "$GITHUB_STEP_SUMMARY"
          # Key the model cache on what's on disk now, so a new model or FluidAudio version saves a fresh cache.
          M="$HOME/Library/Application Support"
          if [ -d "$M/Verbatim/models" ] || [ -d "$M/FluidAudio/Models" ]; then
            H="$(ls -R "$M/Verbatim/models" "$M/FluidAudio/Models" 2>/dev/null | shasum | cut -c1-12)"
            echo "models_key=bench-models-${RUNNER_OS}-fluidaudio-${FLUIDAUDIO_VERSION}-${H}" >> "$GITHUB_OUTPUT"
          fi
          # Add the report to this build's ci-screens commit (only if that commit is still this build's).
          P="$RUNNER_TEMP/bench-publish"; rm -rf "$P"
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch ci-screens "$REPO" "$P" 2>/dev/null && ls "$P"/Verbatim-universal-${N}.dmg >/dev/null 2>&1; then
            cp "$B/out"/bench-* "$P/" 2>/dev/null
            (cd "$P" && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co" \
              && git add -A && git commit -q -m "Bench for build ${N}" \
              && for t in 1 2 3 4 5; do git push -q origin HEAD:ci-screens && break; sleep 5; git pull -q --rebase origin ci-screens; done) || echo "bench publish skipped"
          else
            echo "ci-screens holds a different build; bench report is in the job summary only"
          fi
          exit 0

      - name: "Bench: save speech models"
        if: always() && steps.changes.outputs.bench == 'true' && steps.bench.outputs.models_key != '' && steps.bench.outputs.models_key != steps.benchcache.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Application Support/Verbatim/models
            ~/Library/Application Support/FluidAudio/Models
          key: ${{ steps.bench.outputs.models_key }}

  phone:
    name: iPhone (simulator tour and TestFlight)
    runs-on: macos-26
    # An iPhone compile error or any UITEST FAIL in its self-test fails this job (and skips TestFlight). The Mac job
    # is separate, so its download is never held up.
    defaults:
      run:
        working-directory: mac
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version

      - name: Install Rust (Harper grammar engine)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.toml') }}
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}
      - name: Build FFmpeg (audio only, LGPL)
        run: bash ffmpeg/build.sh
      - name: Generate the project
        run: |
          brew install xcodegen
          [ -f Local.xcconfig ] || : > Local.xcconfig
          xcodegen generate --quiet
          bash tools/package-resolved.sh install

      - name: Build the iPhone app and run its screenshot tour (simulator)
        run: |
          set +e
          P="$RUNNER_TEMP/phone"; rm -rf "$P"; mkdir -p "$P/out/phone-screens-${GITHUB_RUN_NUMBER}"
          bash Vendor/harper/build-ios.sh > "$P/out/phone-harper-${GITHUB_RUN_NUMBER}.log" 2>&1
          # Prebuilt Harper libraries for Xcode builds on Tim's Mac (setup.sh downloads these when Rust isn't installed).
          (cd Vendor/harper && zip -qr "$P/harper-libs.zip" libharper_ffi.a ios ios-sim harper_ffi.h) || true
          if [ -f "$P/harper-libs.zip" ] && [ "$(stat -f%z "$P/harper-libs.zip")" -lt 90000000 ]; then cp "$P/harper-libs.zip" "$P/out/harper-libs.zip"; fi
          xcodebuild -project Verbatim.xcodeproj -scheme VerbatimPhone -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-phone \
            -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > "$P/xcodebuild.log" 2>&1
          status=$?
          grep -E "error:" "$P/xcodebuild.log" | sort -u | head -n 40 > "$P/out/phone-errors-${GITHUB_RUN_NUMBER}.txt"
          tail -n 30 "$P/xcodebuild.log" >> "$P/out/phone-errors-${GITHUB_RUN_NUMBER}.txt"
          if [ $status -ne 0 ]; then
            echo "::error::iPhone build failed"; grep -E "error:" "$P/xcodebuild.log" | sort -u | head -n 8 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          APP="build-phone/Build/Products/Debug-iphonesimulator/Verbatim.app"
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; p=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]; print((p or c)[-1]['udid'])")"
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_VERBATIM_UITEST=1 xcrun simctl launch "$UDID" co.stumpandroot.verbatim.ios
          DATA="$(xcrun simctl get_app_container "$UDID" co.stumpandroot.verbatim.ios data)"
          # The app renders its own screenshots into Documents/screens and writes "done" when the tour ends.
          for i in $(seq 1 200); do [ "$(cat "$DATA/Documents/show.txt" 2>/dev/null)" = "done" ] && break; sleep 1; done
          cp "$DATA/Documents/screens/"*.png "$P/out/phone-screens-${GITHUB_RUN_NUMBER}/" 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot "$P/out/phone-screens-${GITHUB_RUN_NUMBER}/z-device-last.png" > /dev/null 2>&1 || true
          cp "$DATA/Library/Logs/Verbatim/native.log" "$P/out/phone-native-${GITHUB_RUN_NUMBER}.log" 2>/dev/null || true
          # The self-test: every UITEST FAIL fails the job (after the screens are saved), and so does a log with no
          # self-test lines at all (the app never ran it).
          LOGF="$P/out/phone-native-${GITHUB_RUN_NUMBER}.log"
          # The import checks skip on the iPhone (its app leaves the test files out); the Mac's self-test runs them.
          grep "UITEST .*import" "$LOGF" 2>/dev/null || echo "no iPhone import self-test lines in the log"
          selftest=0
          if ! grep -q "UITEST" "$LOGF" 2>/dev/null; then echo "::error::the iPhone self-test didn't run (no UITEST lines in native.log)"; selftest=1; fi
          if grep -q "UITEST FAIL" "$LOGF" 2>/dev/null; then
            grep "UITEST FAIL" "$LOGF" | head -n 40 | cut -c1-400 | while IFS= read -r l; do echo "::error::iPhone $l"; done
            echo "iPhone self-test: $(grep -c 'UITEST PASS' "$LOGF") passed, $(grep -c 'UITEST FAIL' "$LOGF") failed"
            selftest=1
          fi
          (cd "$P/out" && zip -qr "phone-screens-${GITHUB_RUN_NUMBER}.zip" "phone-screens-${GITHUB_RUN_NUMBER}" && rm -rf "phone-screens-${GITHUB_RUN_NUMBER}") || true
          xcrun simctl shutdown "$UDID" || true
          exit $selftest

      # Adds the iPhone results to this build's ci-screens commit once the Mac job has published it.
      - name: Publish the iPhone results to ci-screens
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"; SRC="$RUNNER_TEMP/phone/out"
          [ -d "$SRC" ] || { echo "no iPhone results"; exit 0; }
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in $(seq 1 90); do
            D="$RUNNER_TEMP/ci-screens-$i"; rm -rf "$D"
            if git clone -q --depth 1 --branch ci-screens "$REPO" "$D" 2>/dev/null; then
              NEWEST="$(ls "$D" | sed -n 's/^Verbatim-universal-\([0-9]*\)\.dmg$/\1/p' | sort -n | tail -1)"
              if [ -n "$NEWEST" ] && [ "$NEWEST" -gt "$N" ]; then echo "a newer build owns ci-screens; skipping"; exit 0; fi
              if [ "$NEWEST" = "$N" ]; then
                cp -R "$SRC/." "$D/"
                (cd "$D" && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co" \
                  && git add -A && git commit -q -m "iPhone results for build ${N}" && git push -q origin HEAD:ci-screens) && { echo "published"; exit 0; }
              fi
            fi
            sleep 20
          done
          echo "::warning::Mac results never appeared on ci-screens; iPhone results are in the job log only"

      # Last, so a TestFlight problem never holds up the Mac download.
      - name: Send the iPhone app to TestFlight
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != '' && env.ASC_KEY_P8 != ''
        continue-on-error: true
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          ARCHIVE="$RUNNER_TEMP/VerbatimPhone.xcarchive"
          # The App Store build (mac/APP_STORE.md): the AppStore configuration sets VERBATIM_APP_STORE=YES, so
          # TestFlight gets exactly what App Review sees.
          xcodebuild -project Verbatim.xcodeproj -scheme "VerbatimPhone App Store" -configuration AppStore -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/phone-archive.log" 2>&1 || {
              echo "::error::iPhone archive failed"
              grep -E "error:|No profiles|requires a provisioning|Provisioning profile" "$RUNNER_TEMP/phone-archive.log" | sort -u | head -n 10 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 40 "$RUNNER_TEMP/phone-archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/phone-export" "${AUTH[@]}" > "$RUNNER_TEMP/phone-upload.log" 2>&1 || {
              echo "::error::TestFlight upload failed"
              grep -iE "error|No suitable application records|ITMS-" "$RUNNER_TEMP/phone-upload.log" | sort -u | head -n 10 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 40 "$RUNNER_TEMP/phone-upload.log"; exit 1; }
          echo "::notice::iPhone build ${GITHUB_RUN_NUMBER} uploaded to TestFlight"
          rm -f "$KEY"


  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dmgs/*.dmg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      # Automatic updates: point the appcast at this release's DMG, after the asset exists. The build job signed it.
      # A tag with a suffix (mac-v2.1.0-beta.1) is a prerelease and goes to the beta channel; others are stable.
      - name: "Updates: check out the appcast scripts"
        if: needs.build.outputs.sparkle_signature != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: mac/Updates
      - name: "Updates: add this release to the appcast"
        if: needs.build.outputs.sparkle_signature != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIG: ${{ needs.build.outputs.sparkle_signature }}
          LEN: ${{ needs.build.outputs.sparkle_length }}
          SHORT: ${{ needs.build.outputs.sparkle_short_version }}
          BUNDLE: ${{ needs.build.outputs.sparkle_bundle_version }}
          CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; R="$GITHUB_REPOSITORY"
          bash src/mac/Updates/publish-appcast.sh --channel "$CHANNEL" --version "$BUNDLE" --short-version "$SHORT" \
            --url "https://github.com/${R}/releases/download/${TAG}/Verbatim-universal.dmg" \
            --length "$LEN" --signature "$SIG" --title "Verbose ${SHORT}" \
            --notes-link "https://github.com/${R}/releases/tag/${TAG}"
