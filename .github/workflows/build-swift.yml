name: Build Mac app (SwiftUI)

# Builds, signs, notarizes, and publishes the native Verbatim.app as a universal DMG.
# Runs on pushes to main that touch mac/, on version tags such as mac-v2.0.0, and on demand. The Mac and iPhone parts
# run on separate runners at the same time; the speech bench runs only when speech or dictation code changed (or with
# [bench] in the commit message). Branch pushes get the quick compile check instead (check-swift.yml).
#
# Secrets: MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD, and
# MACOS_PROVISION_PROFILE (a Developer ID provisioning profile with iCloud, base64). Without them the build
# is unsigned and keeps everything on the Mac.
# TestFlight (iPhone): ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8. Xcode's cloud signing for App Store distribution
# needs an App Store Connect API key with the Admin role. With them, every build of main uploads the iPhone app to
# TestFlight.
# Automatic updates (Sparkle, mac/Updates/README.md): SPARKLE_PRIVATE_KEY (EdDSA key from `generate_keys -x`) and
# UPDATES_TOKEN (fine-grained token, Contents read/write on stumpandroot/verbose-updates only), both in the release
# environment. With them and a Developer ID-signed, notarized DMG, builds of main become beta-<run> prereleases and
# mac-v* tags become releases in the public verbose-updates repo, and its appcast.xml points at them.
#
# How secrets are kept apart (security audit A1, A3, A8, A9):
#   - Each secret is passed only to the one step that uses it, never to a whole job. Third-party code (Rust crates,
#     FFmpeg, Homebrew) is built before any key is on the runner, and every key, keychain, and credential is deleted
#     before the app runs for its screenshot tour, self-test, or speech bench.
#   - Jobs that sign or upload (`build` on main and mac-v* tags, `updates`, `testflight`) use the `release`
#     environment, so its protection rules (required reviewers, allowed branches) and secrets apply. GitHub creates
#     the environment, unprotected, the first time a job uses it. Builds of other branches started by hand use no environment and
#     sign only with repository secrets, if any are left.
#   - The workflow token is read-only, except in the small jobs that push to ci-screens; they run no build tools.
#     Checkouts don't keep the token. UPDATES_TOKEN reaches only the updates job's publish step.
#   - Every action is pinned to a full commit SHA (the tag is in the comment).

on:
  push:
    branches: [main]
    tags: ["mac-v*"]
    paths: ["mac/**", ".github/workflows/build-swift.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older build still running, so an old build can't overwrite a newer DMG on ci-screens.
concurrency:
  group: build-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v')) && 'release' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac
    outputs:
      # The DMG's Sparkle signature, for the updates job's appcast update (not secret).
      sparkle_signature: ${{ steps.sparkle.outputs.signature }}
      sparkle_length: ${{ steps.sparkle.outputs.length }}
      sparkle_short_version: ${{ steps.sparkle.outputs.short_version }}
      sparkle_bundle_version: ${{ steps.sparkle.outputs.bundle_version }}
      bench: ${{ steps.changes.outputs.bench }}
      fluidaudio: ${{ steps.fluidver.outputs.version }}
    env:
      # Only whether each secret exists; the values go to the one step that uses each.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Decide whether the speech bench runs
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          RUN=false
          case "$GITHUB_REF" in refs/tags/*) RUN=true ;; esac
          git log -1 --format=%B | grep -qi '\[bench\]' && RUN=true
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            git fetch -q --depth 50 origin main || true
            BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)"
            [ "$BASE" = "$(git rev-parse HEAD)" ] && BASE="$(git rev-parse HEAD~1)"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD || true)"
          echo "$CHANGED" | sed 's/^/changed: /'
          # Speech recognition, dictation, cleanup, audio, the bench itself, package versions, or this workflow.
          if echo "$CHANGED" | grep -Eq '^mac/Verbatim/(Transcription|Audio)/|^mac/Verbatim/Flow/(Cleanup|CleanupPrepass|MeaningCheck|Paster|FlowSettings)\.swift|^mac/Verbatim/App/(Dictation|Bench)\.swift|^mac/Bench/|^mac/project\.yml|^\.github/workflows/build-swift\.yml'; then RUN=true; fi
          echo "bench=$RUN" >> "$GITHUB_OUTPUT"
          echo "Speech bench: $RUN"

      # The bench job's model cache key. mac/Package.resolved pins every Swift package (tools/package-resolved.sh).
      - name: "Bench: find the FluidAudio version (model cache key)"
        if: steps.changes.outputs.bench == 'true'
        id: fluidver
        continue-on-error: true
        run: |
          V="$(python3 - <<'PY'
          import json
          v = ""
          try:
              d = json.load(open("Package.resolved"))
              for pin in d.get("pins") or d.get("object", {}).get("pins", []):
                  if (pin.get("identity") or pin.get("package") or "").lower() == "fluidaudio":
                      st = pin.get("state") or {}
                      v = st.get("version") or st.get("revision", "")[:12]
          except Exception:
              pass
          print(v or "unknown")
          PY
          )"
          echo "FluidAudio $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version; sw_vers

      # Same toolchain as mac/harper-ffi/rust-toolchain.toml; change both together.
      - name: Install Rust (Harper grammar engine)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.lock', 'mac/harper-ffi/Cargo.toml', 'mac/harper-ffi/rust-toolchain.toml') }}
      - name: Install XcodeGen
        run: brew install xcodegen

      # The audio-only LGPL FFmpeg (mac/ffmpeg/build.sh), keyed on the script that pins its version and checksum.
      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}

      # Third-party build code (FFmpeg's configure and make, crate build scripts) runs here, before any key or
      # credential is on the runner; build.sh then finds these up to date and skips them.
      - name: Build FFmpeg, Harper, and the link helper (no keys on the runner yet)
        run: |
          bash ffmpeg/build.sh
          bash Vendor/harper/build.sh
          bash fetch-yt-dlp.sh

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: |
          set +x
          umask 077
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -T: only codesign and security may use the key without a prompt (not -A, which let any process).
          # -x: the private key can't be exported from this keychain.
          # security import has no way to read the password except -P; it's visible only to this job's own
          # processes for the moment the import runs, and GitHub masks it in the log.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -f pkcs12 -x \
            -T /usr/bin/codesign -T /usr/bin/security -P "$MACOS_CERTIFICATE_PASSWORD"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          if [ -n "$MACOS_PROVISION_PROFILE" ]; then
            printf '%s' "$MACOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/verbatim.provisionprofile"
            echo "PROVISION_PROFILE=$RUNNER_TEMP/verbatim.provisionprofile" >> "$GITHUB_ENV"
          fi

      # No secrets in this step; the keychain above signs. Notarization is the next step.
      - name: Build, sign, and package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/mac-v') && github.ref_name || '0.0.0' }}
          BUILD: ${{ github.run_number }}
          DMG_SUFFIX: -universal
          SKIP_NOTARIZE: "1"
        run: |
          set -o pipefail
          if ! VERSION="${VERSION#mac-v}" bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 6 "$RUNNER_TEMP/build.log" | cut -c1-400 | while IFS= read -r line; do echo "::error::${line}"; done
            cat "$RUNNER_TEMP/build.log" build/xcodebuild.log 2>/dev/null | grep -E "error(\[E[0-9]+\])?:" | grep -v "Compiling\|Downloaded\|thiserror" | sort -u | head -n 4 | cut -c1-400 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      # The Apple ID credentials exist only in this step, in a temporary keychain it deletes when it ends.
      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set +x
          NK="$RUNNER_TEMP/notary.keychain-db"
          NKP="$(uuidgen)"
          trap 'security delete-keychain "$NK" 2>/dev/null || true' EXIT
          security create-keychain -p "$NKP" "$NK"
          security set-keychain-settings -lut 7200 "$NK"
          security unlock-keychain -p "$NKP" "$NK"
          # notarytool reads the password only from --password or a terminal prompt; like security import above,
          # it's visible only to this job's own processes while store-credentials runs, and masked in the log.
          xcrun notarytool store-credentials verbatim-notary --keychain "$NK" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          NOTARY_KEYCHAIN="$NK" NOTARY_PROFILE=verbatim-notary bash notarize.sh dist/Verbatim-universal.dmg

      # Automatic updates (mac/Updates/README.md). Builds of main (push or workflow_dispatch) and mac-v* tags only,
      # and only with the Sparkle key and a Developer ID certificate. Never blocks the build. Runs before the app
      # does, so nothing the app or its tour starts is on the runner while the key is.
      - name: "Updates: sign the DMG for Sparkle"
        id: sparkle
        if: env.HAS_SPARKLE_KEY == 'true' && env.HAS_SIGNING == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v'))
        continue-on-error: true
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          DMG=dist/Verbatim-universal.dmg
          if ! codesign -dvv "$DMG" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            echo "::warning::The DMG isn't signed with a Developer ID certificate; no update is published."; exit 0
          fi
          if ! xcrun stapler validate "$DMG" > /dev/null 2>&1; then
            echo "::warning::The DMG isn't notarized; no update is published."; exit 0
          fi
          T="$RUNNER_TEMP/sparkle-tools"; rm -rf "$T"; mkdir -p "$T"
          curl -fsSL -o "$T/Sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $T/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$T/Sparkle.tar.xz" -C "$T"
          # The key goes in on stdin (--ed-key-file -); it is never echoed or written to disk.
          OUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$T/bin/sign_update" --ed-key-file - "$DMG")"
          SIG="$(printf '%s' "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(printf '%s' "$OUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')"
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then echo "::error::sign_update returned no signature"; exit 1; fi
          echo "Sparkle signature for build ${GITHUB_RUN_NUMBER}: length=$LEN"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LEN" >> "$GITHUB_OUTPUT"
          PLIST=build/Build/Products/Release/Verbatim.app/Contents/Info.plist
          echo "short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" >> "$GITHUB_OUTPUT"

      # Removes every key and credential, whatever happened above, before the app runs.
      - name: Remove signing keys and credentials
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/notary.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP/sparkle-tools"
          security list-keychains -d user

      # The signed app runs here with no secrets, keys, or tokens on the runner. ci-screens gets the screenshots
      # and a short summary (the publish-screens job); logs, samples, and crash reports go to a workflow artifact.
      - name: Screenshot tour
        continue-on-error: true
        run: |
          set -x; set +e
          N="${GITHUB_RUN_NUMBER}"
          pkill -9 -x Verbatim || true; sleep 1
          PUB="$RUNNER_TEMP/ci-screens"; DIAG="$RUNNER_TEMP/diagnostics"
          rm -rf "$PUB" "$DIAG"; mkdir -p "$PUB" "$DIAG" dist/screens
          open --env VERBATIM_UITEST=1 build/Build/Products/Release/Verbatim.app > "$DIAG/open-${N}.txt" 2>&1; echo "open exit=$?" >> "$DIAG/open-${N}.txt"
          sleep 20
          perl -e 'alarm 15; exec @ARGV' screencapture -x "$PUB/transcript-${N}.png" || true
          # Screenshot tour: the app writes the current screen's name to show.txt; capture each one.
          SHOW="$HOME/Library/Logs/Verbatim/show.txt"; TOUR="$PUB/screens-${N}"; mkdir -p "$TOUR"; last=""
          # Wait for "done" (up to 15 minutes) so the sampler below never pauses the app mid-tour.
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            cur="$(cat "$SHOW" 2>/dev/null || true)"
            if [ -n "$cur" ] && [ "$cur" != "$last" ]; then
              last="$cur"; [ "$cur" = "done" ] && break
              sleep 1.0; perl -e 'alarm 10; exec @ARGV' screencapture -x "$TOUR/$cur.png" || true
            fi
            sleep 0.5
          done
          (cd "$PUB" && zip -qr "screens-${N}.zip" "screens-${N}" && rm -rf "screens-${N}") || true
          PID="$(pgrep -x Verbatim | head -1 || true)"
          # Main-thread spin shows as sustained CPU on an idle app. Sample three times, 2 s apart.
          { echo "pid=$PID"; for i in 1 2 3; do ps -o %cpu=,rss= -p "$PID" || echo "gone"; sleep 2; done; } > "$DIAG/cpu-${N}.txt" 2>&1 || true
          perl -e 'alarm 25; exec @ARGV' sample "$PID" 3 -file "$DIAG/sample-${N}.txt" || echo "sample timed out" > "$DIAG/sample-${N}.txt"
          perl -e 'alarm 15; exec @ARGV' screencapture -x "$PUB/home-${N}.png" || true
          cp "$HOME/Library/Logs/Verbatim/native.log" "$DIAG/native-${N}.log" || true
          pkill -9 -x Verbatim || true
          sleep 3
          ls -t "$HOME/Library/Logs/DiagnosticReports"/Verbatim* 2>/dev/null | head -1 | while read -r f; do cp "$f" "$DIAG/crash-${N}.ips"; done
          log show --last 3m --predicate 'process == "Verbatim"' --style compact > "$DIAG/oslog-${N}.txt" 2>&1 || true
          cp "$PUB"/*.png dist/screens/ || true

      - name: Summarize the self-test
        if: always()
        run: |
          N="${GITHUB_RUN_NUMBER}"; PUB="$RUNNER_TEMP/ci-screens"; mkdir -p "$PUB"
          LOG="$HOME/Library/Logs/Verbatim/native.log"
          {
            echo "Build ${N} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            if [ -f "$LOG" ]; then
              echo "Mac self-test: $(grep -c 'UITEST PASS' "$LOG") passed, $(grep -c 'UITEST FAIL' "$LOG") failed, finished: $(grep -q 'UITEST DONE' "$LOG" && echo yes || echo no)"
              grep 'UITEST FAIL' "$LOG" | head -n 40 | cut -c1-300
            else
              echo "Mac self-test: no native.log (the app didn't run)"
            fi
            [ -f "$RUNNER_TEMP/diagnostics/crash-${N}.ips" ] && echo "Crash report: yes (in the job log and the mac-diagnostics-${N} artifact)"
            echo "Logs, CPU samples, and crash reports: the mac-diagnostics-${N} artifact on the workflow run (7 days)."
          } > "$PUB/summary-${N}.txt"
          cat "$PUB/summary-${N}.txt"

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Verbatim-universal
          path: mac/dist/Verbatim-universal.dmg
          if-no-files-found: error

      - name: Upload screenshot
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: mac/dist/screens/

      # For the publish-screens job, which pushes it with the DMG to ci-screens.
      - name: Upload screenshots and summary for ci-screens
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-screens-mac
          path: ${{ runner.temp }}/ci-screens/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload logs and crash reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: UI self-test gate (macOS 26)
        run: |
          LOG="$HOME/Library/Logs/Verbatim/native.log"
          tail -n 60 "$LOG" || echo "no native.log"
          ls -t "$HOME/Library/Logs/DiagnosticReports"/Verbatim* 2>/dev/null | head -1 | xargs -I{} sh -c 'echo "::error::crash report {}"; head -c 6000 "{}"'
          grep "UITEST" "$LOG" || { echo "::error::no UITEST lines in the log"; exit 1; }
          grep -q "UITEST DONE" "$LOG" || { echo "::error::self-test did not finish"; exit 1; }
          if grep -q "UITEST FAIL" "$LOG"; then grep "UITEST FAIL" "$LOG" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi

  # Pushes this build's DMG, screenshots, and summary to the ci-screens branch (a fresh commit each build). The
  # branch is reachable where workflow artifacts aren't. Runs even when the self-test failed, as before.
  publish-screens:
    name: Publish to ci-screens
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the DMG
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Verbatim-universal
          path: pub
      - name: Get the screenshots and summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-screens-mac
          path: pub
      - name: Push to the ci-screens branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}"
          if [ ! -f pub/Verbatim-universal.dmg ]; then echo "No DMG from this build; nothing to publish."; exit 0; fi
          cd pub
          mv Verbatim-universal.dmg "Verbatim-universal-${N}.dmg"
          # A stable name for the same DMG, so .../raw/ci-screens/Verbatim-latest.dmg survives the force-push below.
          # Identical bytes share one git blob, so this adds no size.
          cp "Verbatim-universal-${N}.dmg" Verbatim-latest.dmg
          ls -la
          # The token reaches git through a credential helper that reads it from the environment, never argv.
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0="" GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
          git init -q && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co"
          git add . && git commit -q -m "Build ${N} from ${GITHUB_SHA::7}"
          git push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screens

  # Automatic updates (mac/Updates/README.md): publishes this build's signed, notarized DMG to the public
  # stumpandroot/verbose-updates repo (feed and DMGs only, never source) and points its appcast at it. Builds of main
  # become beta-<run> prereleases and refresh beta-latest; mac-v* tags become releases. This repo gets no releases.
  # Without UPDATES_TOKEN, SPARKLE_PRIVATE_KEY, or a Sparkle signature from the build, it skips with a notice.
  updates:
    name: "Updates: publish to verbose-updates"
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    environment: release
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Only whether each secret exists; UPDATES_TOKEN goes to the publish step alone.
      HAS_UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_SIGNATURE: ${{ needs.build.outputs.sparkle_signature != '' }}
    steps:
      - name: Check what's set up
        id: gate
        run: |
          if [ "$HAS_UPDATES_TOKEN" != "true" ]; then
            echo "::notice::No update published: UPDATES_TOKEN isn't set in the release environment (mac/Updates/README.md)."
          elif [ "$HAS_SPARKLE_KEY" != "true" ]; then
            echo "::notice::No update published: SPARKLE_PRIVATE_KEY isn't set in the release environment (mac/Updates/README.md)."
          elif [ "$HAS_SIGNATURE" != "true" ]; then
            echo "::notice::No update published: the build made no Sparkle signature. See the build job's \"Updates: sign the DMG for Sparkle\" step (Developer ID signing and notarization are required)."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: mac/Updates
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Verbatim-universal
          path: dist
      - name: Publish the DMG and the appcast
        if: steps.gate.outputs.publish == 'true'
        env:
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          UPDATES_REPO: stumpandroot/verbose-updates
          SIG: ${{ needs.build.outputs.sparkle_signature }}
          LEN: ${{ needs.build.outputs.sparkle_length }}
          SHORT: ${{ needs.build.outputs.sparkle_short_version }}
          BUNDLE: ${{ needs.build.outputs.sparkle_bundle_version }}
        run: bash mac/Updates/publish-update.sh dist/Verbatim-universal.dmg

  # Accuracy and latency bench (mac/Bench/README.md), on its own runner with no secrets, from this build's DMG.
  # A bench problem never blocks a build. bench-<run>.json and bench-<run>.md go to this build's ci-screens commit
  # (the publish-bench job); the bench's logs and any crash report go to a workflow artifact.
  bench:
    name: Speech bench
    needs: build
    if: needs.build.outputs.bench == 'true'
    runs-on: macos-26
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Verbatim-universal
          path: ${{ runner.temp }}/dmg
      - name: "Bench: copy the app out of the DMG"
        run: |
          M="$RUNNER_TEMP/mnt"; mkdir -p "$M" "$RUNNER_TEMP/app"
          hdiutil attach -nobrowse -readonly -mountpoint "$M" "$RUNNER_TEMP/dmg/Verbatim-universal.dmg"
          ditto "$M/Verbatim.app" "$RUNNER_TEMP/app/Verbatim.app"
          hdiutil detach "$M" || hdiutil detach -force "$M"

      - name: "Bench: restore speech models"
        id: benchcache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Application Support/Verbatim/models
            ~/Library/Application Support/FluidAudio/Models
          key: bench-models-${{ runner.os }}-fluidaudio-${{ needs.build.outputs.fluidaudio }}
          restore-keys: |
            bench-models-${{ runner.os }}-fluidaudio-${{ needs.build.outputs.fluidaudio }}-

      - name: "Bench: run the synthetic clips through dictation's pipeline"
        id: bench
        continue-on-error: true
        timeout-minutes: 30
        env:
          FLUIDAUDIO_VERSION: ${{ needs.build.outputs.fluidaudio }}
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"; APP="$RUNNER_TEMP/app/Verbatim.app"
          B="$RUNNER_TEMP/bench"; rm -rf "$B"; mkdir -p "$B/out" "$B/clips" "$B/diag"
          LOGDIR="$HOME/Library/Logs/Verbatim"; REPORTS="$HOME/Library/Logs/DiagnosticReports"
          touch "$B/started"
          # Clips come from the runner's built-in voices, so no private audio is involved.
          say -v '?' > "$B/diag/bench-voices-${N}.txt" 2>&1
          bash Bench/make-clips.sh "$B/clips" > "$B/diag/bench-clips-${N}.log" 2>&1
          echo "clips: $(ls "$B/clips"/*.wav 2>/dev/null | wc -l | tr -d ' ')"
          pkill -9 -x Verbatim || true
          rm -f "$LOGDIR/native.log"
          # VERBATIM_UITEST=1 gives a clean offline profile (no iCloud, no welcome screens); -bench turns the UI tour off.
          # Models download from Hugging Face on the first run. The app stops itself at 20 minutes with a partial report.
          open -W -n --env VERBATIM_UITEST=1 "$APP" --args \
            -bench "$B/clips" -benchOut "$B/out/bench-${N}.json" -benchModels "v3,ultra,v2" -benchMinutes 20 \
            -benchLabel "build ${N} (${GITHUB_SHA::7})" > "$B/open.txt" 2>&1 &
          OPENPID=$!
          for i in $(seq 1 1380); do kill -0 "$OPENPID" 2>/dev/null || break; sleep 1; done
          pkill -9 -x Verbatim || true
          wait "$OPENPID" 2>/dev/null
          # Compare vocabulary-boost profiles on the two fastest models (a few minutes each).
          for PROF in norescue legacy; do
            open -W -n --env VERBATIM_UITEST=1 "$APP" --args \
              -bench "$B/clips" -benchOut "$B/out/bench-${N}-${PROF}.json" -benchModels "v3,v2" -benchMinutes 8 -benchCleanup none \
              -fluidBoostProfile "$PROF" -benchLabel "build ${N} boost=${PROF}" >> "$B/open.txt" 2>&1 &
            P2=$!
            for i in $(seq 1 540); do kill -0 "$P2" 2>/dev/null || break; sleep 1; done
            pkill -9 -x Verbatim || true
            wait "$P2" 2>/dev/null
          done
          mv "$LOGDIR/native.log" "$B/diag/bench-native-${N}.log" 2>/dev/null || true
          cp "$B/open.txt" "$B/diag/bench-open-${N}.txt" 2>/dev/null || true
          find "$REPORTS" -name 'Verbatim*' -newer "$B/started" 2>/dev/null | head -1 | while read -r f; do cp "$f" "$B/diag/bench-crash-${N}.ips"; echo "::warning::the app crashed during the bench (bench-crash-${N}.ips in the bench-diagnostics-${N} artifact)"; done
          if [ ! -s "$B/out/bench-${N}.md" ]; then
            { echo "# Verbatim bench: build ${N}"; echo; echo "The bench produced no report. Last log lines:"; echo; echo '```'
              grep BENCH "$B/diag/bench-native-${N}.log" 2>/dev/null | tail -n 20; cat "$B/open.txt" 2>/dev/null; echo '```'; } > "$B/out/bench-${N}.md"
          fi
          cat "$B/out/bench-${N}.md" >> "$GITHUB_STEP_SUMMARY"
          # Key the model cache on what's on disk now, so a new model or FluidAudio version saves a fresh cache.
          M="$HOME/Library/Application Support"
          if [ -d "$M/Verbatim/models" ] || [ -d "$M/FluidAudio/Models" ]; then
            H="$(ls -R "$M/Verbatim/models" "$M/FluidAudio/Models" 2>/dev/null | shasum | cut -c1-12)"
            echo "models_key=bench-models-${RUNNER_OS}-fluidaudio-${FLUIDAUDIO_VERSION}-${H}" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: "Bench: save speech models"
        if: always() && steps.bench.outputs.models_key != '' && steps.bench.outputs.models_key != steps.benchcache.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Application Support/Verbatim/models
            ~/Library/Application Support/FluidAudio/Models
          key: ${{ steps.bench.outputs.models_key }}

      - name: "Bench: upload the report for ci-screens"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-screens-bench
          path: ${{ runner.temp }}/bench/out/
          if-no-files-found: ignore
          retention-days: 3
      - name: "Bench: upload logs and crash reports"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/bench/diag/
          if-no-files-found: ignore
          retention-days: 7

  publish-bench:
    name: Publish the bench report to ci-screens
    needs: [bench, publish-screens]
    if: always() && needs.bench.result == 'success' && needs.publish-screens.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ci-screens-bench
          path: results
      - name: Add the report to this build's ci-screens commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHAT: Bench
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"; SRC="$PWD/results"
          [ -n "$(ls -A "$SRC" 2>/dev/null)" ] || { echo "no $WHAT results"; exit 0; }
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0="" GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
          D="$RUNNER_TEMP/ci-screens"; rm -rf "$D"
          git clone -q --depth 1 --branch ci-screens "https://github.com/${GITHUB_REPOSITORY}.git" "$D" || { echo "::warning::couldn't clone ci-screens; $WHAT results are in the workflow artifacts only"; exit 0; }
          NEWEST="$(ls "$D" | sed -n 's/^Verbatim-universal-\([0-9]*\)\.dmg$/\1/p' | sort -n | tail -1)"
          if [ "$NEWEST" != "$N" ]; then echo "ci-screens holds build ${NEWEST:-none}, not ${N}; $WHAT results are in the workflow artifacts only"; exit 0; fi
          cp -R "$SRC/." "$D/"
          cd "$D" && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co"
          git add -A && git commit -q -m "$WHAT results for build ${N}" || { echo "nothing new"; exit 0; }
          for t in 1 2 3 4 5 6; do
            git push -q origin HEAD:ci-screens && { echo "published"; exit 0; }
            sleep 5; git pull -q --rebase origin ci-screens
          done
          echo "::warning::couldn't push $WHAT results to ci-screens"

  phone:
    name: iPhone (simulator tour)
    runs-on: macos-26
    # An iPhone compile error or any UITEST FAIL in its self-test fails this job (and skips TestFlight). The Mac job
    # is separate, so its download is never held up. No secrets here.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version

      # Same toolchain as mac/harper-ffi/rust-toolchain.toml; change both together.
      - name: Install Rust (Harper grammar engine)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.lock', 'mac/harper-ffi/Cargo.toml', 'mac/harper-ffi/rust-toolchain.toml') }}
      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}
      - name: Build FFmpeg (audio only, LGPL)
        run: bash ffmpeg/build.sh
      - name: Generate the project
        run: |
          brew install xcodegen
          [ -f Local.xcconfig ] || : > Local.xcconfig
          xcodegen generate --quiet
          bash tools/package-resolved.sh install

      # ci-screens gets the screenshots and a short summary (publish-phone job); full logs go to a workflow artifact.
      - name: Build the iPhone app and run its screenshot tour (simulator)
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"
          P="$RUNNER_TEMP/phone"; rm -rf "$P"; mkdir -p "$P/out/phone-screens-${N}" "$P/diag"
          SUMMARY="$P/out/phone-summary-${N}.txt"
          echo "iPhone build ${N} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" > "$SUMMARY"
          bash Vendor/harper/build-ios.sh > "$P/diag/phone-harper-${N}.log" 2>&1
          xcodebuild -project Verbatim.xcodeproj -scheme VerbatimPhone -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-phone \
            -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > "$P/xcodebuild.log" 2>&1
          status=$?
          grep -E "error:" "$P/xcodebuild.log" | sort -u | head -n 40 > "$P/diag/phone-errors-${N}.txt"
          tail -n 30 "$P/xcodebuild.log" >> "$P/diag/phone-errors-${N}.txt"
          if [ $status -ne 0 ]; then
            echo "::error::iPhone build failed"; grep -E "error:" "$P/xcodebuild.log" | sort -u | head -n 8 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
            { echo "iPhone build: failed"; grep -E "error:" "$P/xcodebuild.log" | sort -u | head -n 8 | cut -c1-300; } >> "$SUMMARY"
            exit 1
          fi
          echo "iPhone build: succeeded" >> "$SUMMARY"
          APP="build-phone/Build/Products/Debug-iphonesimulator/Verbatim.app"
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; p=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]; print((p or c)[-1]['udid'])")"
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_VERBATIM_UITEST=1 xcrun simctl launch "$UDID" co.stumpandroot.verbatim.ios
          DATA="$(xcrun simctl get_app_container "$UDID" co.stumpandroot.verbatim.ios data)"
          # The app renders its own screenshots into Documents/screens and writes "done" when the tour ends.
          for i in $(seq 1 200); do [ "$(cat "$DATA/Documents/show.txt" 2>/dev/null)" = "done" ] && break; sleep 1; done
          cp "$DATA/Documents/screens/"*.png "$P/out/phone-screens-${N}/" 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot "$P/out/phone-screens-${N}/z-device-last.png" > /dev/null 2>&1 || true
          cp "$DATA/Library/Logs/Verbatim/native.log" "$P/diag/phone-native-${N}.log" 2>/dev/null || true
          # The self-test: every UITEST FAIL fails the job (after the screens are saved), and so does a log with no
          # self-test lines at all (the app never ran it).
          LOGF="$P/diag/phone-native-${N}.log"
          # The import checks skip on the iPhone (its app leaves the test files out); the Mac's self-test runs them.
          grep "UITEST .*import" "$LOGF" 2>/dev/null || echo "no iPhone import self-test lines in the log"
          PASSED="$(grep -c 'UITEST PASS' "$LOGF" 2>/dev/null)"; FAILED="$(grep -c 'UITEST FAIL' "$LOGF" 2>/dev/null)"
          echo "iPhone self-test: ${PASSED:-0} passed, ${FAILED:-0} failed" >> "$SUMMARY"
          selftest=0
          if ! grep -q "UITEST" "$LOGF" 2>/dev/null; then echo "::error::the iPhone self-test didn't run (no UITEST lines in native.log)"; echo "iPhone self-test: didn't run" >> "$SUMMARY"; selftest=1; fi
          if grep -q "UITEST FAIL" "$LOGF" 2>/dev/null; then
            grep "UITEST FAIL" "$LOGF" | head -n 40 | cut -c1-400 | while IFS= read -r l; do echo "::error::iPhone $l"; done
            grep "UITEST FAIL" "$LOGF" | head -n 40 | cut -c1-300 >> "$SUMMARY"
            selftest=1
          fi
          echo "Logs: the phone-diagnostics-${N} artifact on the workflow run (7 days)." >> "$SUMMARY"
          cat "$SUMMARY"
          (cd "$P/out" && zip -qr "phone-screens-${N}.zip" "phone-screens-${N}" && rm -rf "phone-screens-${N}") || true
          xcrun simctl shutdown "$UDID" || true
          exit $selftest

      - name: Upload screenshots and summary for ci-screens
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-screens-phone
          path: ${{ runner.temp }}/phone/out/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/phone/diag/
          if-no-files-found: ignore
          retention-days: 7

  # Adds the iPhone results to this build's ci-screens commit once the Mac results are there.
  publish-phone:
    name: Publish the iPhone results to ci-screens
    needs: [phone, publish-screens]
    if: always() && needs.publish-screens.result == 'success' && (needs.phone.result == 'success' || needs.phone.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ci-screens-phone
          path: results
      - name: Add the results to this build's ci-screens commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHAT: iPhone
        run: |
          set +e
          N="${GITHUB_RUN_NUMBER}"; SRC="$PWD/results"
          [ -n "$(ls -A "$SRC" 2>/dev/null)" ] || { echo "no $WHAT results"; exit 0; }
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0="" GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
          D="$RUNNER_TEMP/ci-screens"; rm -rf "$D"
          git clone -q --depth 1 --branch ci-screens "https://github.com/${GITHUB_REPOSITORY}.git" "$D" || { echo "::warning::couldn't clone ci-screens; $WHAT results are in the workflow artifacts only"; exit 0; }
          NEWEST="$(ls "$D" | sed -n 's/^Verbatim-universal-\([0-9]*\)\.dmg$/\1/p' | sort -n | tail -1)"
          if [ "$NEWEST" != "$N" ]; then echo "ci-screens holds build ${NEWEST:-none}, not ${N}; $WHAT results are in the workflow artifacts only"; exit 0; fi
          cp -R "$SRC/." "$D/"
          cd "$D" && git config user.name "verbatim-ci" && git config user.email "ci@stumpandroot.co"
          git add -A && git commit -q -m "$WHAT results for build ${N}" || { echo "nothing new"; exit 0; }
          for t in 1 2 3 4 5 6; do
            git push -q origin HEAD:ci-screens && { echo "published"; exit 0; }
            sleep 5; git pull -q --rebase origin ci-screens
          done
          echo "::warning::couldn't push $WHAT results to ci-screens"

  # TestFlight, on its own runner after the iPhone self-test passes. It builds the third-party code first, and the
  # App Store Connect key exists only in the archive-and-upload step.
  testflight:
    name: TestFlight (iPhone)
    needs: phone
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    # A TestFlight problem never fails the build.
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_ASC == 'true'
        with:
          persist-credentials: false
      - name: Select Xcode
        if: env.HAS_ASC == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"; xcodebuild -version
      - name: Install Rust (Harper grammar engine)
        if: env.HAS_ASC == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Cache cargo
        if: env.HAS_ASC == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/harper-ffi/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('mac/harper-ffi/Cargo.lock', 'mac/harper-ffi/Cargo.toml', 'mac/harper-ffi/rust-toolchain.toml') }}
      - name: Cache FFmpeg
        if: env.HAS_ASC == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac/Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('mac/ffmpeg/build.sh') }}
      - name: Build FFmpeg and Harper, generate the project, and fetch packages (no key on the runner yet)
        if: env.HAS_ASC == 'true'
        run: |
          set -o pipefail
          bash ffmpeg/build.sh
          bash Vendor/harper/build-ios.sh
          brew install xcodegen
          [ -f Local.xcconfig ] || : > Local.xcconfig
          xcodegen generate --quiet
          bash tools/package-resolved.sh install
          xcodebuild -resolvePackageDependencies -project Verbatim.xcodeproj -scheme "VerbatimPhone App Store" \
            -clonedSourcePackagesDirPath build/spm > "$RUNNER_TEMP/resolve.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/resolve.log"; exit 1; }

      - name: Send the iPhone app to TestFlight
        if: env.HAS_ASC == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          set -o pipefail
          # Pasted secrets often carry spaces or a newline; strip them, then check the shapes so a mix-up (one ID in
          # the other's slot, or a command pasted as a value) fails here with a clear message, never mid-archive.
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          bad=0
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID isn't a Key ID (10 capital letters and digits, ${#KEY_ID} characters found). Set it again with: gh secret set ASC_KEY_ID --env release --body <Key ID>"; bad=1; }
          [[ "$ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::ASC_ISSUER_ID isn't an Issuer ID (36 characters with dashes, ${#ISSUER} found). Set it again with: gh secret set ASC_ISSUER_ID --env release --body <Issuer ID>"; bad=1; }
          grep -q "BEGIN PRIVATE KEY" <<< "$ASC_KEY_P8" || { echo "::error::ASC_KEY_P8 isn't a .p8 key file. Set it again with: gh secret set ASC_KEY_P8 --env release < AuthKey_<Key ID>.p8"; bad=1; }
          [ $bad -eq 0 ] || exit 1
          KEY="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$KEY")
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          ARCHIVE="$RUNNER_TEMP/VerbatimPhone.xcarchive"
          # The App Store build (mac/APP_STORE.md): the AppStore configuration sets VERBATIM_APP_STORE=YES, so
          # TestFlight gets exactly what App Review sees.
          xcodebuild -project Verbatim.xcodeproj -scheme "VerbatimPhone App Store" -configuration AppStore -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/phone-archive.log" 2>&1 || {
              echo "::error::iPhone archive failed"
              grep -E "error:|No profiles|requires a provisioning|Provisioning profile" "$RUNNER_TEMP/phone-archive.log" | sort -u | head -n 10 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 40 "$RUNNER_TEMP/phone-archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/phone-export" "${AUTH[@]}" > "$RUNNER_TEMP/phone-upload.log" 2>&1 || {
              echo "::error::TestFlight upload failed"
              grep -iE "error|No suitable application records|ITMS-" "$RUNNER_TEMP/phone-upload.log" | sort -u | head -n 10 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 40 "$RUNNER_TEMP/phone-upload.log"; exit 1; }
          echo "::notice::iPhone build ${GITHUB_RUN_NUMBER} uploaded to TestFlight"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
